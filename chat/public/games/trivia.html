<!doctype html>
<html lang="en">
<head>
<script src="net.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trivia Rush</title>
<style>
  :root{--pk-accent:#7c3aed;--pk-soft:#f3e8ff;--pk-font:"Trebuchet MS",system-ui,sans-serif;color-scheme:light}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:var(--pk-font);background:radial-gradient(circle at 20% 10%,#a855f7 0,transparent 45%),radial-gradient(circle at 90% 90%,#f97316 0,transparent 40%),linear-gradient(135deg,#312e81,#6d28d9);color:#1f2937;overflow:auto}
  #app{min-height:100%;display:grid;place-items:start center;padding:24px 16px}
  .tr-wrap{width:min(1000px,100%);display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:16px;align-items:start}
  @media (max-width:760px){.tr-wrap{grid-template-columns:1fr}}
  .tr-main{background:#fff;border-radius:22px;padding:20px;box-shadow:0 18px 50px rgba(0,0,0,.3);display:grid;gap:14px}
  .tr-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .tr-chip{padding:5px 12px;border-radius:999px;background:#f3e8ff;color:#6d28d9;font-weight:800;font-size:13px}
  .tr-timer{margin-left:auto;font:900 28px var(--pk-font);color:#6d28d9;min-width:48px;text-align:right}
  .tr-timer.low{color:#dc2626}
  .tr-bar{height:8px;border-radius:999px;background:#ede9fe;overflow:hidden}
  .tr-bar i{display:block;height:100%;background:linear-gradient(90deg,#7c3aed,#ec4899);transition:width .25s linear}
  .tr-q{font:800 clamp(20px,3.2vw,30px)/1.25 var(--pk-font);margin:4px 0}
  .tr-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:560px){.tr-opts{grid-template-columns:1fr}}
  .tr-opt{position:relative;border:0;border-radius:16px;padding:18px 16px 18px 56px;min-height:74px;text-align:left;font:800 18px var(--pk-font);color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.25);transition:transform .08s,opacity .2s}
  .tr-opt b{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.25);display:grid;place-items:center}
  .tr-opt:hover:not(:disabled){transform:translateY(-2px)}
  .tr-opt:disabled{cursor:default}
  .tr-opt.o0{background:#ef4444}.tr-opt.o1{background:#3b82f6}.tr-opt.o2{background:#eab308}.tr-opt.o3{background:#22c55e}
  .tr-opt.mine{outline:4px solid #111827;outline-offset:2px}
  .tr-opt.dim{opacity:.35}
  .tr-opt.right{opacity:1;outline:4px solid #16a34a;outline-offset:2px}
  .tr-opt.right::after{content:'✓';position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:26px}
  .tr-opt .who{display:block;font-size:12px;font-weight:600;opacity:.95;margin-top:4px}
  .tr-msg{text-align:center;font-weight:800;font-size:18px;color:#6d28d9;min-height:24px}
  .tr-side{background:rgba(255,255,255,.95);border-radius:22px;padding:16px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
  .tr-side h3{margin:0 0 10px;font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:#6d28d9}
  .tr-row{display:grid;grid-template-columns:22px 12px 1fr auto;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid #f3f4f6;font-weight:700}
  .tr-row i{width:12px;height:12px;border-radius:50%}
  .tr-row .gain{color:#16a34a;font-size:12px;font-weight:800}
  .tr-row.me{background:#faf5ff;border-radius:10px}
  .tr-row .tick{color:#16a34a}
  .tr-pod{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:10px 0}
  .tr-pod div{width:110px;border-radius:14px 14px 0 0;color:#fff;text-align:center;padding:10px 6px;font-weight:800}
  .tr-pod .p1{height:150px;background:linear-gradient(#facc15,#ca8a04)}
  .tr-pod .p2{height:115px;background:linear-gradient(#cbd5e1,#64748b)}
  .tr-pod .p3{height:90px;background:linear-gradient(#fdba74,#c2410c)}
  .tr-pod span{display:block;font-size:30px}
</style>
</head>

const Q = [

['Who was the first President of the United States?','George Washington','Abraham Lincoln','Thomas Jefferson','John Adams','History'],

['Which empire built the Colosseum?','The Roman Empire','The Greek Empire','The Ottoman Empire','The Persian Empire','History'],
['Who was the first woman to fly solo across the Atlantic?','Amelia Earhart','Bessie Coleman','Harriet Quimby','Sally Ride','History'],
['In what year did humans first land on the Moon?','1969','1959','1975','1981','History'],
['What did the Wright brothers invent?','The first powered airplane','The car','The telephone','The radio','History'],
['What is the main ingredient in guacamole?','Avocado','Tomato','Pea','Lime','Food'],

['How many days are in a leap year?','366','365','364','367','General'],
['What is the opposite of "ancient"?','Modern','Old','Antique','Historic','General'],
['How many hours are in a day?','24','12','48','36','General'],
['Which month has the fewest days?','February','April','June','November','General'],
['What do you call a word that reads the same backward, like "level"?','A palindrome','An anagram','A synonym','An acronym','General'],
['How many strings does a standard guitar have?','6','4','5','8','Music'],
['How many keys are on a standard piano?','88','76','92','64','Music'],
['Which instrument has 47 strings and pedals?','Harp','Cello','Violin','Banjo','Music'],
['What do you call a group of four musicians?','A quartet','A trio','A duet','A quintet','Music'],
['Which famous composer became deaf?','Beethoven','Mozart','Bach','Chopin','Music'],
['What is the plural of "mouse" (the animal)?','Mice','Mouses','Meese','Mousen','Words'],
['Which of these is a verb?','Run','Happy','Blue','Quickly','Words'],
['What is a synonym for "huge"?','Enormous','Tiny','Narrow','Quiet','Words'],
['What is the opposite of "brave"?','Cowardly','Bold','Strong','Fearless','Words'],
['How many letters are in the English alphabet?','26','24','28','25','Words'],
['Which language has the most native speakers?','Mandarin Chinese','English','Spanish','Hindi','Words'],
['What does "www" stand for in a web address?','World Wide Web','Wide Web World','Web World Wide','World Web Wire','Tech'],
['What does "CPU" stand for?','Central Processing Unit','Computer Power Unit','Central Program Utility','Core Processing Usage','Tech'],
['What company makes the iPhone?','Apple','Samsung','Google','Microsoft','Tech'],
['How many bits are in a byte?','8','4','16','10','Tech'],
['What does a computer mouse control?','The pointer on the screen','The speakers','The power','The internet','Tech'],
['Which key do you press to type a capital letter for a moment?','Shift','Ctrl','Alt','Tab','Tech'],
];
let ROUNDS = 10; try { ROUNDS = Math.max(1, Math.min(10, +localStorage.getItem('tr.rounds') || 10)); } catch (e) {} // (a shorter game for tests)
const ANSWER_MS = 15000, REVEAL_MS = 5000;
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const host = {
  start(players, t) {
    const ids = shuffle(Q.map((_, i) => i)).slice(0, ROUNDS);
    const s = { ids, i: -1, phase: 'q', ends: 0, order: [], ans: {}, score: players.map(() => 0), gain: players.map(() => 0), streak: players.map(() => 0) };
    next(s, t);
    return s;
  },
  action(s, i, a, t) {
    if (s.phase !== 'q' || !a || typeof a.pick !== 'number' || s.ans[i] || a.pick < 0 || a.pick > 3) return false;
    s.ans[i] = [a.pick, Math.max(0, s.ends - t)];
    return true;
  },
  gone(s, i) { s.out = s.out || []; s.out[i] = true; },
  tick(s, t) {
    if (s.phase === 'q') {
      const playing = s.score.filter((_, p) => !(s.out && s.out[p])).length;
      if (t >= s.ends || Object.keys(s.ans).filter((p) => !(s.out && s.out[p])).length >= playing) { reveal(s); s.ends = t + REVEAL_MS; return true; }
    } else if (s.phase === 'reveal' && t >= s.ends) {
      if (s.i + 1 >= s.ids.length) { s.phase = 'done'; return true; }
      next(s, t); return true;
    }
    return false;
  },
};
function next(s, t) { s.i++; s.phase = 'q'; s.ans = {}; s.order = shuffle([0, 1, 2, 3]); s.ends = t + ANSWER_MS; s.gain = s.score.map(() => 0); }
function reveal(s) {
  s.phase = 'reveal';
  const right = s.order.indexOf(0); // answer 0 in the bank is the right one
  s.score.forEach((_, p) => {
    const a = s.ans[p];
    if (a && a[0] === right) {
      s.streak[p]++;
      s.gain[p] = 500 + Math.round(500 * a[1] / ANSWER_MS) + (s.streak[p] > 1 ? 100 * (s.streak[p] - 1) : 0);
      s.score[p] += s.gain[p];
    } else { s.streak[p] = 0; s.gain[p] = 0; }
  });
}

let shown = '';
function render(v, el) {
  const s = v.state, q = Q[s.ids[s.i]] || Q[0];
  const key = `${v.id}:${s.i}:${s.phase}:${v.v}`;
  if (v.soft && key === shown) { timer(v, s); return; }
  shown = key;
  const esc = PartyKit.esc;
  const ranked = v.players.map((p, i) => ({ p, i, sc: s.score[i] })).sort((a, b) => b.sc - a.sc);
  const side = `<div class="tr-side"><h3>Scores</h3>${ranked.map((r, k) => `<div class="tr-row${r.i === v.me ? ' me' : ''}"><span>${k + 1}</span><i style="background:${esc(r.p.color)}"></i>
      <span>${esc(r.p.name)}${r.p.gone ? ' 👋' : ''} ${s.phase === 'q' && s.ans[r.i] ? '<span class="tick">✓</span>' : ''}</span>
      <span>${r.sc}${s.phase !== 'q' && s.gain[r.i] ? ` <span class="gain">+${s.gain[r.i]}</span>` : ''}</span></div>`).join('')}</div>`;
  if (s.phase === 'done') {
    const pod = ranked.slice(0, 3);
    el.innerHTML = `<div class="tr-wrap"><div class="tr-main"><div class="tr-q" style="text-align:center">🏆 Final scores</div>
      <div class="tr-pod">${[1, 0, 2].filter((k) => pod[k]).map((k) => `<div class="p${k + 1}"><span>${['🥇', '🥈', '🥉'][k]}</span>${esc(pod[k].p.name)}<br>${pod[k].sc}</div>`).join('')}</div>
      <div class="tr-msg">${ranked[0] && ranked[0].i === v.me ? 'You win! 🎉' : `${esc(ranked[0].p.name)} wins!`}</div>
      <div class="pk-row" style="justify-content:center">${v.isHost ? '<button class="pk-btn" id="again">🔁 Back to the lobby</button>' : '<span class="pk-tag">The host can start another game.</span>'}
      <button class="pk-btn pk-ghost" id="leave">Leave server</button></div></div>${side}</div>`;
    const ag = el.querySelector('#again'); if (ag) ag.onclick = v.again;
    el.querySelector('#leave').onclick = v.leave;
    return;
  }
  const right = s.order.indexOf(0), mine = v.me >= 0 ? s.ans[v.me] : null, rev = s.phase === 'reveal';
  const who = (k) => v.players.map((p, i) => (s.ans[i] && s.ans[i][0] === k ? p.name : null)).filter(Boolean);
  let msg = '';
  if (v.me < 0) msg = 'You’re watching this game. Join the next one from the lobby!';
  else if (rev) msg = mine && mine[0] === right ? `Correct! +${s.gain[v.me]} ${s.streak[v.me] > 1 ? `🔥 ${s.streak[v.me]} in a row` : ''}` : mine ? 'Not this time!' : 'Too slow!';
  else if (mine) msg = 'Locked in! Waiting for the others…';
  el.innerHTML = `<div class="tr-wrap"><div class="tr-main">
    <div class="tr-top"><span class="tr-chip">Question ${s.i + 1} of ${s.ids.length}</span><span class="tr-chip">${esc(q[5])}</span><span class="tr-timer" id="t"></span></div>
    <div class="tr-bar"><i id="bar"></i></div>
    <div class="tr-q">${esc(q[0])}</div>
    <div class="tr-opts">${s.order.map((src, k) => {
      const cls = ['tr-opt', 'o' + k, mine && mine[0] === k ? 'mine' : '', rev ? (k === right ? 'right' : 'dim') : ''].join(' ');
      const names = rev ? who(k) : [];
      return `<button class="${cls}" data-k="${k}" ${rev || mine || v.me < 0 ? 'disabled' : ''}><b>${'ABCD'[k]}</b>${esc(q[1 + src])}${names.length ? `<span class="who">${names.map(esc).join(', ')}</span>` : ''}</button>`;
    }).join('')}</div>
    <div class="tr-msg">${msg}</div></div>${side}</div>`;
  el.querySelectorAll('.tr-opt').forEach((b) => b.onclick = () => { v.send({ pick: +b.dataset.k }); b.classList.add('mine'); el.querySelectorAll('.tr-opt').forEach((x) => x.disabled = true); });
  timer(v, s);
}
function timer(v, s) {
  const t = document.getElementById('t'), bar = document.getElementById('bar');
  if (!t) return;
  const left = v.left(s.ends);
  t.textContent = s.phase === 'q' ? left : '';
  t.classList.toggle('low', s.phase === 'q' && left <= 5);
  bar.style.width = s.phase === 'q' ? `${Math.min(100, (left / (ANSWER_MS / 1000)) * 100)}%` : '0%';
}
addEventListener('keydown', (e) => { const k = '1234'.indexOf(e.key); if (k >= 0) { const b = document.querySelector(`.tr-opt[data-k="${k}"]`); if (b && !b.disabled) b.click(); } });

PartyKit.start({
  code: 'tr', title: 'Trivia Rush', emoji: '🧠', min: 2, max: 12, servers: 6, el: document.getElementById('app'),
  tagline: 'Ten quick questions. Right answers score, faster right answers score more.',
  rules: '<b>How to play:</b> pick an answer before the 15 seconds run out (or press 1–4). A right answer is worth 500 points plus up to 500 more for speed, and +100 for every right answer in a row. Highest score after 10 questions wins.',
  host, render,
});
</script>
