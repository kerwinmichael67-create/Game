<!DOCTYPE html>
<html lang="en"><head>
<script src="net.js"></script><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Space Shooter</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#05060f;color:#cfe;font-family:system-ui,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center}
canvas{background:#05060f;max-width:100%;max-height:calc(100% - 8px);touch-action:none;border:1px solid #234}
/* co-op servers */
#coopBtn{position:fixed;top:10px;right:10px;z-index:5;background:rgba(10,20,40,.85);color:#cfe;border:1px solid #3a8cff;border-radius:8px;padding:8px 12px;font:bold 13px system-ui;cursor:pointer}
#coopBtn:hover{background:#13284a}
#coopBtn[hidden],#coopPanel[hidden]{display:none}
#coopPanel{position:fixed;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;background:rgba(2,4,12,.78);padding:16px}
.cp{width:min(420px,100%);max-height:100%;overflow:auto;background:#0a1328;border:1px solid #3a8cff;border-radius:12px;padding:18px;box-shadow:0 20px 60px #000a}
.cp h2{margin:0 0 4px;font-size:20px;color:#fff}
.cp p{margin:6px 0;font-size:13.5px;color:#9cd;line-height:1.45}
.cp b{color:#fff}
.cp button{font:bold 13px system-ui;border-radius:8px;padding:8px 12px;cursor:pointer;border:1px solid #3a8cff;background:#13284a;color:#cfe}
.cp button.main{width:100%;padding:12px;font-size:15px;background:linear-gradient(#3a8cff,#2a6ad0);color:#fff;border:0;margin:8px 0}
.cp button:disabled{opacity:.45;cursor:default}
.cp .row{display:flex;gap:8px;margin-top:10px}
.cp .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.cp .srv{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:9px 11px;border:1px solid #234;background:#0d1a33;border-radius:8px}
.cp .srv:hover:not(:disabled){border-color:#3a8cff;background:#13284a}
.cp .srv.here{border-color:#66eeff;background:#10304a;opacity:1}
.cp .srv small{font-weight:500;color:#9cd;font-size:12px}
.cp .srv .bar{display:flex;gap:3px}
.cp .srv .bar i{width:14px;height:4px;border-radius:1px;background:#234}
.cp .srv .bar i.on{background:#66eeff}
.cp .label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#789;margin-top:12px}
.cp ul{margin:6px 0;padding-left:18px;font-size:13.5px}
</style></head><body>
<canvas id="c" width="480" height="720"></canvas>
<button id="coopBtn" hidden>👥 Co-op</button>
<div id="coopPanel" hidden><div class="cp" id="coopBody"></div></div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),W=480,H=720;
let keys={},touch=null,state='title',lvl=1,kills=0,fuel=100,hull=3,score=0,t=0;
let ship,bullets,ebul,rocks,foes,pups,boss,bossDone,allies,parts,rings=[],bombs=[],reinfCd=0,reinfLeft=3,stars,planet,msg='',msgT=0;
stars=Array.from({length:150},(_,i)=>{const l=i%3;return{x:Math.random()*W,y:Math.random()*H,l,s:[.8,1.4,2.2][l]*(.7+Math.random()*.6),v:[.4,.9,1.8][l],p:Math.random()*6,c:['#9ab','#cde','#fff','#adf','#fda'][i%5]}});
function reset(full){ship={x:W/2,y:H-90,cd:0,inv:0,sh:0,rf:0,tri:(!full&&ship&&ship.tri)||0};bullets=[];ebul=[];rocks=[];foes=[];pups=[];allies=[];parts=[];rings=[];bombs=[];reinfLeft=CALLS();boss=null;bossDone=false;planet=null;kills=0;
 if(full){reinfCd=0;lvl=1;fuel=100;hull=SH.hull;score=0}}
function say(m){msg=m;msgT=120}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key===' '||e.key==='Tab')e.preventDefault();if(Coop.mate())return;const rk={r:'F',e:'B',g:'G',h:'H',t:'T',c:'D'}[e.key.toLowerCase()];if(rk)callReinf(rk);if(state==='title'){if(e.key==='?'||e.key.toLowerCase()==='h')tHelp=!tHelp;else if(!tHelp&&e.key.toLowerCase()==='b'){state='select';hTab=2}else if(tHelp&&e.key!==' '&&e.key!=='Enter')tHelp=false}if(state==='select')navSel(e.key.toLowerCase());if(state==='map')navMap(e.key.toLowerCase());if(state==='brief'&&e.key.toLowerCase()==='m')toMap();if(state==='over'&&e.key.toLowerCase()==='h')state='select';
 if(e.key===' '||e.key==='Enter')advance()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
cv.addEventListener('pointerdown',e=>{const q=pos(e);if(Coop.mate()){touch=q;return}if(state==='play'){const ow=Object.keys(REINF).filter(k=>SAVE.rf.includes(k)),bi=ow.findIndex((k,i)=>hit(q,{x:W-30-i*56,y:H-36},28));if(bi>=0){callReinf(ow[bi]);return}}if(state==='title'){if(tHelp){tHelp=false;return}const bx=(x,y,w,h)=>q.x>=x&&q.x<=x+w&&q.y>=y&&q.y<=y+h;if(bx(60,508,170,34)){state='select';hTab=0;return}if(bx(250,508,170,34)){state='select';hTab=2;return}if(bx(150,550,180,32)){tHelp=true;return}advance();return}if(state==='brief'&&q.x<130&&q.y>670){toMap();return}if(state==='select'){selTap(q);return}if(state==='map'){mapTap(q);return}if(state!=='play'&&state!=='land'){advance();return}touch=q});
cv.addEventListener('pointermove',e=>{if(touch)touch=pos(e)});
addEventListener('pointerup',()=>touch=null);
const hit=(a,b,r)=>Math.hypot(a.x-b.x,a.y-b.y)<r;
/* ======================================================================
   CO-OP — servers in the chat's 🕹️ Games (window.claude rooms).
   Everyone on a server flies the host's missions together. The host's
   game runs the mission (enemies, hits, the shared hull and fuel) and
   shares it ~20 times a second; every other pilot flies their own ship
   on their own screen and shares where it is and whether it's firing.
   ====================================================================== */
const Coop=(()=>{
  const SERVERS=6,MAX=4,WORLD=['brief','play','land','over','win'];
  const C={srv:0,lobby:null,room:null,peers:[],pres:new Map(),lobbyPeers:[],name:'Pilot',t0:0,offs:[],busy:false,queued:null,
    mates:[],me:null,snap:null,viewing:false,evs:[],evSeq:0,lastEv:0,sendAt:0,lastIn:'',inAt:0,status:'',joining:false,lastScore:null,wasHost:false};
  const btn=document.getElementById('coopBtn'),panel=document.getElementById('coopPanel'),body=document.getElementById('coopBody');
  const r1=v=>Math.round(v*10)/10,r0=Math.round;
  let lobbyP=null;
  if(window.claude){btn.hidden=false}
  function lobby(){
    if(!lobbyP)lobbyP=(async()=>{
      const room=window.claude&&await window.claude.use('room');if(!room)return null;
      C.lobby=room;room.onPeers(ch=>{C.lobbyPeers=ch.peers;if(!panel.hidden)render()},()=>{});
      try{const u=await window.claude.use('user'),me=u&&await u.me();if(me&&me.name)C.name=String(me.name).slice(0,16)}catch(e){}
      return room})();
    return lobbyP}
  const myPeer=()=>{const m=C.peers.find(q=>q.isMe);return m?m.peer:''};
  function crew(){return C.peers.filter(q=>q.presence&&q.presence.t).map(q=>({peer:q.peer,nm:String(q.presence.nm||'Pilot').slice(0,16),t:+q.presence.t,isMe:q.isMe,s:+q.presence.s||0,g:q.presence.g,inp:q.presence.in}))
    .sort((a,b)=>a.t-b.t||(a.peer<b.peer?-1:1))}
  const host=()=>crew()[0];
  const isHost=()=>!C.srv||!!(host()&&host().isMe);
  const mate=()=>C.viewing;
  function send(patch){if(!C.room)return;if(C.busy){C.queued=Object.assign(C.queued||{},patch);return}C.busy=true;const room=C.room;
    room.presence(patch).catch(()=>{}).then(()=>{C.busy=false;if(C.queued&&C.room===room){const q=C.queued;C.queued=null;send(q)}})}
  function counts(){const c=new Array(SERVERS+1).fill(0);C.lobbyPeers.forEach(q=>{const n=q.presence&&q.presence.srv;if(n>=1&&n<=SERVERS)c[n]++});return c}
  async function join(n){
    if(C.joining)return;C.joining=true;C.status='Joining server '+n+'…';render();
    try{if(C.srv)await leave();const lob=await lobby();if(!lob){C.status="Co-op isn't available here.";return}
      const room=await lob.join('srv-'+n);C.room=room;C.srv=n;C.t0=Date.now();C.peers=[];C.status='';
      C.offs.push(room.onPeers(onPeers,()=>{}));
      send({nm:C.name,t:C.t0,s:Math.max(0,SHIPS.indexOf(SH))});lob.presence({srv:n}).catch(()=>{});
    }catch(e){C.status="Couldn't reach that server.";C.room=null;C.srv=0}
    finally{C.joining=false;render()}}
  function joinRandom(){const c=counts(),open=[];for(let n=1;n<=SERVERS;n++)if(n!==C.srv&&c[n]<MAX)open.push(n);
    if(!open.length){C.status='Every server is full right now.';render();return}join(open[Math.floor(Math.random()*open.length)])}
  async function leave(){
    stopView();const room=C.room;C.offs.forEach(f=>{try{f()}catch(e){}});C.offs=[];C.room=null;C.srv=0;C.peers=[];C.mates=[];C.busy=false;C.queued=null;
    if(C.lobby)C.lobby.presence({srv:null}).catch(()=>{});if(room)await room.leave().catch(()=>{});render()}
  function stopView(){if(C.viewing){C.viewing=false;C.snap=null;C.lastScore=null;reset(true);state='title';save()}}
  function render(){
    const c=counts(),cr=crew(),h=cr[0];let o='<h2>👥 Co-op</h2>';
    if(C.status)o+=`<p>${esc(C.status)}</p>`;
    if(!C.srv){o+='<p>Fly the campaign together: up to 4 pilots per server share one hull and one fuel tank, and the host picks the mission.</p>'}
    else if(!cr.length){o+=`<p>Joining <b>Server ${C.srv}</b>…</p>`}
    else{o+=`<p>You're on <b>Server ${C.srv}</b>:</p><ul>${cr.map((p,i)=>`<li>${esc(p.nm)}${p.isMe?' (you)':''}${i===0?' — host':''} · ${esc((SHIPS[p.s]||SHIPS[0]).n)}</li>`).join('')}</ul>`;
      o+=h&&h.isMe?'<p>You\'re the host: pick a mission and everyone here flies it with you.</p>':`<p><b>${esc(h?h.nm:'The host')}</b> picks the mission. You'll join as soon as it launches — fly with the arrows or WASD, hold SPACE to shoot.</p>`}
    o+=`<button class="main" data-random ${C.joining?'disabled':''}>${C.srv?'Move to a random server':'Join a random server'}</button>`;
    o+='<div class="label">Or pick a server</div><div class="grid">';
    for(let n=1;n<=SERVERS;n++){const here=n===C.srv,k=here?Math.max(c[n],cr.length,1):c[n],full=k>=MAX;
      o+=`<button class="srv${here?' here':''}" data-srv="${n}" ${here||full||C.joining?'disabled':''}><b>Server ${n}</b><small>${here?'You are here':full?'Full':k?k+' of '+MAX+' pilots':'Empty'}</small><span class="bar">${[0,1,2,3].map(i=>`<i class="${i<k?'on':''}"></i>`).join('')}</span></button>`}
    o+='</div><div class="row">'+(C.srv?'<button data-leave>Leave server</button>':'')+'<button data-close style="margin-left:auto">Back to the game</button></div>';
    body.innerHTML=o;
    btn.textContent=C.srv?`👥 Server ${C.srv} · ${cr.length}`:'👥 Co-op'}
  body.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
    if(b.dataset.srv)join(+b.dataset.srv);else if('random' in b.dataset)joinRandom();else if('leave' in b.dataset)leave();else if('close' in b.dataset)panel.hidden=true});
  btn.addEventListener('click',()=>{panel.hidden=false;render();if(!C.srv)lobby().then(r=>{if(!r)C.status="Co-op isn't available here.";render()})});
  const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function onPeers(ch){
    C.peers=ch.peers;const cr=crew(),h=cr[0],me=myPeer();
    if(h&&h.isMe){
      if(C.viewing){stopView();say('You are the co-op host now')}
      // keep one record per other pilot; their ship moves where they fly it
      const keep=new Map(C.mates.map(m=>[m.peer,m]));
      C.mates=cr.slice(1,MAX).map((p,i)=>{const m=keep.get(p.peer)||{peer:p.peer,x:W/2+(i%2?60:-60)*(1+(i>>1)),y:H-90,f:0,inv:120,sh:0,tri:0,rf:0,cd:0};
        m.nm=p.nm;m.s=SHIPS[p.s]?p.s:0;if(p.inp&&typeof p.inp.x==='number'){m.x=p.inp.x;m.y=p.inp.y;m.f=p.inp.f}return m});
    }else if(h&&cr.slice(0,MAX).some(p=>p.peer===me)){
      // on someone else's server you fly their missions; between missions you wait for the next one
      if(!C.viewing)startView();
      if(h.g){C.snap=h.g;apply(h.g)}
    }
    if(!panel.hidden)render();else btn.textContent=C.srv?`👥 Server ${C.srv} · ${cr.length}`:'👥 Co-op';
  }

  /* ---------------- host ---------------- */
  const tgt=o=>{let best=ship,bd=Math.hypot(ship.x-o.x,ship.y-o.y);if(C.viewing)return best;
    C.mates.forEach(m=>{const d=Math.hypot(m.x-o.x,m.y-o.y);if(d<bd){bd=d;best=m}});return best};
  function hostFire(){
    if(C.viewing||!C.srv)return;
    C.mates.forEach(m=>{const S=SHIPS[m.s]||SHIPS[0];m.cd--;if(m.tri>0)m.tri--;if(m.rf>0)m.rf--;
      if(m.f&&m.cd<=0){const bd=S.dm||1,pc=S.pierce?1:0;if(m.tri>0||S.tri)[-2.2,0,2.2].forEach(v=>bullets.push({x:m.x,y:m.y-18,vx:v,d:bd,pc}));else bullets.push({x:m.x,y:m.y-18,vx:0,d:bd,pc});m.cd=m.rf>0?Math.ceil(S.cd/2):S.cd}
      if(t%2===0)parts.push({x:m.x+(Math.random()-.5)*5,y:m.y+16,vx:(Math.random()-.5)*.5,vy:1.8+Math.random(),l:12,c:'#ffaa44',s:1.2})})}
  function hostHits(){
    if(C.viewing||!C.srv||state!=='play')return;
    C.mates.forEach(m=>{const S=SHIPS[m.s]||SHIPS[0];
      pups.forEach(p=>{if(p.dead||!hit(p,m,24))return;p.dead=1;const k=p.k;boom(p.x,p.y,16,PU[k][0]);
        if(k==='T'){m.tri=600;say(m.nm+': triple shot!')}else if(k==='L'){hull=Math.min(SH.maxH,hull+1);say('Hull repaired +1')}else if(k==='F'){fuel=Math.min(100,fuel+25);say('Fuel +25')}
        else if(k==='S'){m.sh=480;say(m.nm+': shield!')}else if(k==='R'){m.rf=480;say(m.nm+': rapid fire!')}else if(k==='W'){reinfLeft++;say('+1 reinforcement call')}else if(k==='B'){nuke();say('Bomb!')}});
      if(m.sh>0){m.sh--;ebul=ebul.filter(b=>!hit(b,m,30));rocks.forEach(r=>{if(hit(r,m,r.r+26)){r.dead=1;boom(r.x,r.y,8,'#aa9')}});return}
      if(m.inv>0){m.inv--;return}
      const h=rocks.some(r=>hit(r,m,r.r+10))||foes.some(f=>hit(f,m,(f.r||18)+8))||(boss&&hit(boss,m,50))||(boss&&boss.bm>0&&Math.abs(m.x-boss.bx)<20)||ebul.some(b=>hit(b,m,12));
      if(h&&state==='play'){hull--;m.inv=S.inv||90;boom(m.x,m.y,24,S.c);ebul=ebul.filter(b=>!hit(b,m,60));foes.forEach(f=>{if(hit(f,m,(f.r||18)+8)&&f.k!=='H')f.dead=1});say(m.nm+' took a hit!');if(hull<=0){state='over';say('Ship destroyed')}}});
    pups=pups.filter(p=>!p.dead);rocks=rocks.filter(r=>!r.dead);foes=foes.filter(f=>!f.dead)}
  function ev(x,y,n,c){if(C.viewing||!C.srv||!C.mates.length)return;C.evs.push([performance.now(),[++C.evSeq,r0(x),r0(y),Math.min(n,40),c]]);if(C.evs.length>30)C.evs.shift()}
  const rb=o=>{const out={};for(const k in o){const v=o[k];if(typeof v==='number')out[k]=r1(v);else if(typeof v!=='object')out[k]=v}return out};
  function snap(){
    const now=performance.now(),world=WORLD.includes(state);
    if(!world)return{st:state};
    C.evs=C.evs.filter(e=>now-e[0]<700);
    const g={st:state,lv:lvl,k:kills,sc:score,fu:r1(fuel),hu:hull,mh:SH.maxH,hs:Math.max(0,SHIPS.indexOf(SH)),m:msgT>0?[msg,msgT]:null,rc:reinfLeft,
      sh:[r0(ship.x),r0(ship.y),ship.inv|0,ship.sh|0,ship.tri|0,ship.rf|0],
      ma:C.mates.map(m=>[m.peer,r0(m.x),r0(m.y),m.inv|0,m.sh|0,m.s,m.tri|0,m.rf|0]),
      r:rocks.map(r=>[r0(r.x),r0(r.y),r0(r.r),r1(r.a),r1(r.sd||1),r1(r.vx),r1(r.vy)]),
      f:foes.map(f=>[f.k||'S',r0(f.x),r0(f.y),f.hp,f.mhp,f.fl|0,r1(f.ph||0)]),
      e:ebul.slice(-80).map(b=>[r0(b.x),r0(b.y),r1(b.vx),r1(b.vy),b.c||'',b.r||0]),
      b:bullets.slice(-60).map(b=>[r0(b.x),r0(b.y),r1(b.vx||0)]),
      p:pups.map(p=>[p.k,r0(p.x),r0(p.y)]),
      bo:boss?rb(boss):null,
      al:allies.map(a=>[a.k,r0(a.x),r0(a.y),a.hp,a.mhp,a.hf|0,a.heals|0,r1(a.fl||0)]),
      bm:bombs.map(b=>[r0(b.x),r0(b.y)]),
      pl:planet?[r0(planet.y),r0(planet.pad)]:null,
      ev:C.evs.map(e=>e[1])};
    for(const key of ['e','b','ev','r']){while(JSON.stringify(g).length>3800&&g[key].length)g[key].splice(0,Math.max(1,g[key].length>>2))}
    return g}
  function tick(){
    if(!C.srv||C.viewing)return;const now=performance.now(),world=WORLD.includes(state);
    if(now-C.sendAt<(world&&C.mates.length?50:600))return;C.sendAt=now;
    if(isHost())send({g:snap()})}

  /* ---------------- other pilots ---------------- */
  function startView(){
    C.viewing=true;C.lastEv=0;C.lastScore=null;const cr=crew(),i=Math.max(1,cr.findIndex(p=>p.isMe));
    C.me={x:W/2+(i%2?60:-60)*(1+((i-1)>>1)),y:H-90,init:false};panel.hidden=true;touch=null}
  function apply(g){
    const prevSt=state;
    if(!WORLD.includes(g.st)){state=g.st;C.me.init=false;return}
    state=g.st;lvl=g.lv;kills=g.k;fuel=g.fu;hull=g.hu;reinfLeft=g.rc;
    if(C.lastScore!=null&&g.sc>C.lastScore){cAcc+=g.sc-C.lastScore;if(cAcc>=10){credits+=Math.floor(cAcc/10);cAcc%=10}}C.lastScore=g.sc;score=g.sc;
    if(g.m){msg=g.m[0];msgT=g.m[1]}
    const hs=g.sh;ship={x:hs[0],y:hs[1],inv:hs[2],sh:hs[3],tri:hs[4],rf:hs[5],cd:0};
    const me=myPeer();
    C.mates=g.ma.map(a=>({peer:a[0],x:a[1],y:a[2],inv:a[3],sh:a[4],s:a[5],tri:a[6],rf:a[7],nm:(crew().find(p=>p.peer===a[0])||{}).nm||'Pilot'}));
    const mine=C.mates.find(m=>m.peer===me);
    if(mine&&!C.me.init){C.me.x=mine.x;C.me.y=mine.y;C.me.init=true}
    if(state==='land'&&prevSt!=='land')C.me.y=Math.min(C.me.y,200);
    rocks=g.r.map(a=>({x:a[0],y:a[1],r:a[2],a:a[3],sd:a[4],vx:a[5],vy:a[6]}));
    const old=new Map(foes.map((f,i)=>[i,f]));
    foes=g.f.map((a,i)=>{const o=old.get(i);return{k:a[0],x:o&&o.k===a[0]?o.x:a[1],y:o&&o.k===a[0]?o.y:a[2],tx:a[1],ty:a[2],hp:a[3],mhp:a[4],fl:a[5],ph:a[6],r:FT[a[0]]?FT[a[0]].r:18}});
    ebul=g.e.map(a=>({x:a[0],y:a[1],vx:a[2],vy:a[3],c:a[4]||undefined,r:a[5]||undefined}));
    bullets=g.b.map(a=>({x:a[0],y:a[1],vx:a[2]}));
    pups=g.p.map(a=>({k:a[0],x:a[1],y:a[2]}));

{n:'Static Fields',p:3,who:'Nav. Ilse',b:'Our sensors scream with static out here. Raider snipers hover at range and snap off fast aimed shots. Keep moving and never sit in their lines of fire.',hz:'Long-range snipers (purple), static interference',tip:'Snipers hold position near the top. Close in or dodge sideways.'},
{n:'The Hive Queen',p:2,boss:'HIVE QUEEN',who:'Col. Rook',b:'Intel confirms a raider carrier, the Hive Queen, is directing the swarm from above Frost. Cut off the head and the fleet collapses. She is heavily armored, so bring everything you have.',hz:'Swarm escorts, armored carrier',tip:'Unlock bombers (E) in the hangar: they hit bosses hard.'},
{n:'Raider Homeworld',p:1,who:'Adm. Okoye',b:'We have found the main staging base on the volcanic world of Ember. This is the big strike: smash the defenders and choke off raider production. Save a wingman call for when things get ugly.',hz:'Fortified defenders, snipers and guards',tip:'Wingman calls are limited per mission, so time them well.'},
{n:'Dust and Steel',p:4,who:'Adm. Okoye',b:'Heavy gunships roll out of the Dune desert. They are slow and armored and fire three-shot fans, but they carry power-ups. Take them down and keep your speed up.',hz:'Heavy gunships (orange, 5 hits), interceptors',tip:'Heavies drop power-ups most of the time. Hunt them.'},
{n:'Lava Tubes',p:1,who:'Nav. Ilse',b:'Narrow lava tubes funnel raider waves straight at you. Debris and heat make every shot count. Keep your hull up and your fuel topped.',hz:'Heavy waves, volcanic debris',tip:'Green crosses repair one heart. Grab them when hurt.'},
{n:'Counterstrike',p:0,who:'Cmdr. Vale',b:'The raiders are striking back at Verdant with everything they have. This is our home. Do not let them through.',hz:'Mixed squadrons, heavy gunships',tip:'Engine upgrades from the hangar make dodging much easier.'},
{n:'Iron Sentinel',p:0,boss:'IRON SENTINEL',who:'Cmdr. Vale',b:'A raider war machine called the Iron Sentinel is bearing down on the Verdant colony. It must not reach the surface. Hit it hard and keep moving, because its volleys are punishing.',hz:'Armored war machine, heavy volleys',tip:'Spend credits on Guns upgrades to melt boss armor faster.'},
{n:'Outer Rim',p:2,who:'Col. Rook',b:'Sector Delta, beyond the frontier. The raiders keep their supply depots out here in the cold, guarded by veteran pilots and a new yellow splitter ship. Burn the depots and the war ends sooner.',hz:'Veteran pilots, splitters (break into swarmers)',tip:'Splitters burst into two swarmers. Finish the swarmers fast.'},
{n:'Ember Gauntlet',p:1,who:'Nav. Ilse',b:'A canyon of lava vents and mines is the fastest way through Delta, and the raiders know it. Interceptors will come at you from all sides. Stay sharp and keep your hull up.',hz:'Interceptor swarms, volcanic debris',tip:'Fuel is tighter out here. Upgrade your Fuel tank if you run dry.'},
{n:'Derelict Fleet',p:4,who:'Adm. Okoye',b:'A graveyard of wrecked warships hides live raider gunships among the hulls. Rocks and wreckage fill the lanes. Stay sharp.',hz:'Wreckage, mixed elite squadrons',tip:'Tankers (T) top you up mid-mission. Unlock them in the hangar.'},
{n:'Siren Belt',p:3,who:'Col. Rook',b:'Our long-range scans picked up raider sniper nests inside the Siren belt. Thread the storm, avoid their lines, and break the nests.',hz:'Sniper nests, storm turbulence',tip:'Guard drones (C) orbit you and absorb bullets.'},
{n:'The Warden',p:3,boss:'THE WARDEN',who:'Adm. Okoye',b:'The Warden guards the gate to the final sector. It is the last big fleet obstacle before Omega. Take it down and the way is open. Everything we have is behind you.',hz:'Heavy guardian, relentless escorts',tip:'A red bomb icon wipes every enemy on screen and chips the boss.'},
{n:'Gate to Omega',p:4,who:'Nav. Ilse',b:'Omega sector is crawling with raider elites. The gate is strewn with wreckage from earlier battles and every shot counts. Stay near your wingmen and keep pushing forward.',hz:'Elite fighters, wreckage fields',tip:'Try a different ship in the hangar if yours is struggling.'},
{n:'The Long Dark',p:2,who:'Col. Rook',b:'No stars, no support. Out here the only light comes from raider guns. The enemy fleet is thick and fast, and a mistake costs you a heart. Hold on for the final strike.',hz:'Massed elites, constant fire',tip:'Shield, rapid fire and triple shot all stack. Use them together.'},
{n:'Broken Moon',p:1,who:'Adm. Okoye',b:'A shattered moon is the last raider forward base. Debris and defenders are everywhere. Cut through before they can regroup.',hz:'Heavy defenders, splitters, debris',tip:'Medics (H) repair up to 2 hearts. Great for long fights.'},
{n:'Eye of the Storm',p:3,who:'Cmdr. Vale',b:'The final approach runs straight through a permanent storm, and the raiders best pilots wait inside. We are almost there. Keep the line.',hz:'Elite swarms, snipers, lightning',tip:'Save a wingman call for the final mission.'},
{n:'The Dread Core',p:3,boss:'THE DREAD CORE',who:'Adm. Okoye',b:'This is it. The Dread Core is the final raider weapon, powering their whole war machine. Destroy it and the sectors are free. The fate of every colony rests on this strike. Good luck, pilot.',hz:'The Dread Core and its full fleet',tip:'Bring everything: bombers, fighters, shield and triple shot.'}];
