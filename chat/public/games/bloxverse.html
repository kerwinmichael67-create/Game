<!doctype html>
<html lang="en">
<head>
<script src="net.js"></script>
<script src="sfx.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bloxverse</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --fh:"Fredoka","Nunito","Segoe UI",system-ui,sans-serif;
    --fb:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
    --bg:#0c0f15;
    --glass:linear-gradient(180deg,rgba(34,40,53,.9),rgba(17,21,29,.92));
    --solid:linear-gradient(180deg,#222937,#151a24);
    --line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);
    --hi:inset 0 1px 0 rgba(255,255,255,.1);
    --drop:0 10px 28px rgba(0,0,0,.35);
    --muted:#94a3b8;--dim:#64748b;
    --exp:linear-gradient(135deg,#1e293b,#334155);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);font-family:var(--fb);font-weight:700;color:#fff;-webkit-user-select:none;user-select:none;touch-action:none}
  button{font-family:inherit}
  canvas#view{display:block;position:fixed;inset:0;width:100%;height:100%}
  canvas#view:focus{outline:none}
  @keyframes pop{0%{transform:scale(.86);opacity:0}100%{transform:scale(1);opacity:1}}
  @keyframes slideIn{0%{transform:translateX(24px);opacity:0}100%{transform:none;opacity:1}}
  @keyframes rise{0%{transform:translateY(14px);opacity:0}100%{transform:none;opacity:1}}
  @keyframes toastPop{0%{transform:translate(-50%,-50%) scale(.5)}60%{transform:translate(-50%,-50%) scale(1.12)}100%{transform:translate(-50%,-50%) scale(1)}}
  @keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-6px) rotate(4deg)}}
  @keyframes spin{to{transform:rotate(375deg)}}
  @keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.55),0 5px 0 #0f6b30}50%{box-shadow:0 0 0 10px rgba(34,197,94,0),0 5px 0 #0f6b30}}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

  /* ---------- the in-game HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:2}
  #hud[hidden]{display:none}
  .glass{background:var(--glass);border:1px solid var(--line);box-shadow:var(--drop),var(--hi)}
  #topbar{position:absolute;left:12px;top:12px;display:flex;gap:8px;align-items:center;pointer-events:auto}
  #menuBtn{width:46px;height:46px;border-radius:14px;color:#fff;cursor:pointer;display:grid;place-items:center;padding:0;transition:transform .12s}
  #menuBtn:hover{transform:scale(1.06)}
  #menuBtn:active{transform:scale(.95)}
  .mark{display:block;width:20px;height:20px;background:#fff;border-radius:4px;transform:rotate(15deg);position:relative;box-shadow:0 2px 0 rgba(0,0,0,.35)}
  .mark::after{content:'';position:absolute;left:35%;top:35%;width:30%;height:30%;background:#111827;border-radius:1px}
  #title{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px 0 6px;border-radius:14px}
  #title .tt{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:19px;background:var(--exp);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2),0 2px 0 rgba(0,0,0,.3)}
  #title .tn{display:flex;flex-direction:column;line-height:1.1}
  #title b{font:600 15px var(--fh);letter-spacing:.01em}
  #title small{font:800 11px var(--fb);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
  #coins{display:flex;align-items:center;gap:8px;height:46px;padding:0 14px 0 8px;border-radius:14px;font:600 17px var(--fh);color:#fde68a;white-space:nowrap}
  #coins i{font-style:normal;color:#86efac;font-size:14px;transition:opacity .6s}
  .coin{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;flex:none;background:radial-gradient(circle at 34% 30%,#fff7c2 0 12%,#fcd34d 34%,#f59e0b 70%,#d97706);box-shadow:inset 0 -2px 0 rgba(146,64,14,.45),0 2px 0 rgba(0,0,0,.35);font:700 13px/1 var(--fh);color:#92400e;text-shadow:0 1px 0 rgba(255,255,255,.4)}
  .coin::before{content:'B'}
  .coin.sm{width:18px;height:18px;font-size:10px;vertical-align:-3px}
  #xhud{position:absolute;inset:0;pointer-events:none}
  #prompt{position:absolute;left:50%;bottom:168px;transform:translateX(-50%);display:none;align-items:center;gap:12px;padding:8px 18px 8px 8px;border-radius:16px;font:600 16px var(--fh);pointer-events:auto;cursor:pointer;white-space:nowrap;animation:rise .18s ease-out}
  #prompt kbd{display:grid;place-items:center;width:36px;height:36px;margin:0;padding:0;background:linear-gradient(180deg,#fff,#e2e8f0);color:#0f172a;border-radius:10px;font:700 18px var(--fh);box-shadow:0 3px 0 #94a3b8}
  #prompt:hover{border-color:rgba(255,255,255,.35)}
  #xbar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:8px;align-items:flex-end;pointer-events:auto;max-width:calc(100vw - 20px);overflow-x:auto;overflow-y:hidden;padding:12px 10px 8px;scrollbar-width:none}
  #xbar::-webkit-scrollbar{display:none}
  #xbar:empty{display:none}
  .hasbar #stat{bottom:calc(var(--barH,84px) + 16px)}
  .touchy.hasbar #xbar{bottom:130px}
  .touchy.hasbar #stat{bottom:calc(var(--barH,84px) + 138px)}
  .xslot{flex:none;min-width:72px;height:72px;border-radius:17px;background:linear-gradient(180deg,rgba(55,65,84,.94),rgba(25,31,42,.96));border:2px solid rgba(255,255,255,.14);color:#fff;font:600 11.5px/1.05 var(--fh);letter-spacing:.01em;text-shadow:0 1px 0 rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;padding:7px 8px 6px;text-align:center;gap:4px;box-shadow:0 4px 0 rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.14),0 10px 18px rgba(0,0,0,.25);transition:transform .12s,border-color .12s,box-shadow .12s}
  .xslot:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.32)}
  .xslot:active{transform:translateY(1px)}
  .xslot.on{border-color:#fde047;background:linear-gradient(180deg,rgba(133,104,20,.96),rgba(66,50,10,.97));box-shadow:0 0 0 3px rgba(250,204,21,.28),0 4px 0 rgba(0,0,0,.4),0 0 24px rgba(250,204,21,.4);transform:translateY(-5px)}
  .xslot:disabled{opacity:.5;cursor:default;transform:none;filter:grayscale(.5)}
  .xslot .k{position:absolute;left:5px;top:5px;min-width:17px;height:17px;padding:0 4px;border-radius:6px;background:rgba(0,0,0,.45);font:600 10px/17px var(--fh);color:#e2e8f0;text-shadow:none}
  .xslot .n{position:absolute;right:-7px;top:-8px;background:linear-gradient(180deg,#fde047,#f59e0b);color:#422006;border-radius:999px;padding:3px 7px 2px;font:700 11px/1.1 var(--fh);text-shadow:none;box-shadow:0 2px 0 #b45309,0 0 0 2px rgba(0,0,0,.25);white-space:nowrap}
  .xslot .e{font-size:27px;line-height:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
  .xslot .pic{width:46px;height:46px;object-fit:contain;margin:-6px 0 -3px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
  .xslot.info{cursor:default;min-width:100px;gap:2px;font-size:12px}
  .xslot.info:hover{transform:none;border-color:rgba(255,255,255,.14)}
  .xslot.info b{font:700 18px var(--fh)}
  /* a column of big coloured buttons on the left (menus, orders) */
  #xside{position:absolute;left:12px;top:50%;transform:translateY(-50%);display:grid;grid-template-columns:repeat(2,66px);gap:9px;pointer-events:auto}
  #xside.one{grid-template-columns:66px}
  #xside:empty{display:none}
  .touchy #xside{transform:translateY(-60%) scale(.82);transform-origin:left center}
  .sbtn{--c1:#64748b;--c2:#475569;--c3:#1e293b;width:66px;height:66px;border-radius:18px;border:2px solid rgba(0,0,0,.28);background:linear-gradient(180deg,var(--c1),var(--c2));box-shadow:0 4px 0 var(--c3),inset 0 2px 0 rgba(255,255,255,.3),0 10px 18px rgba(0,0,0,.28);color:#fff;font:600 11.5px/1 var(--fh);text-shadow:0 1.5px 0 rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;position:relative;padding:0;transition:transform .1s,filter .15s}
  .sbtn:hover{transform:translateY(-2px) scale(1.04);filter:brightness(1.08)}
  .sbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--c3),inset 0 2px 0 rgba(255,255,255,.3)}
  .sbtn .e{font-size:27px;line-height:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}
  .sbtn .k{position:absolute;left:4px;top:4px;font:600 10px/1 var(--fh);background:rgba(0,0,0,.35);border-radius:5px;padding:2px 4px;text-shadow:none}
  .sbtn .n{position:absolute;right:-7px;top:-7px;min-width:22px;height:22px;border-radius:11px;background:#ef4444;border:2px solid #fff;font:700 11px/18px var(--fh);padding:0 5px;text-shadow:none}
  .sbtn.on{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.35),0 4px 0 var(--c3),inset 0 2px 0 rgba(255,255,255,.3),0 0 22px rgba(255,255,255,.35)}
  .c-red{--c1:#f87171;--c2:#dc2626;--c3:#7f1d1d}.c-purple{--c1:#c084fc;--c2:#9333ea;--c3:#581c87}.c-blue{--c1:#60a5fa;--c2:#2563eb;--c3:#1e3a8a}
  .c-brown{--c1:#d6a06b;--c2:#a16207;--c3:#5b3410}.c-green{--c1:#4ade80;--c2:#16a34a;--c3:#14532d}.c-gold{--c1:#fde047;--c2:#f59e0b;--c3:#92400e}
  .c-teal{--c1:#2dd4bf;--c2:#0d9488;--c3:#134e4a}.c-pink{--c1:#f9a8d4;--c2:#db2777;--c3:#831843}.c-orange{--c1:#fdba74;--c2:#ea580c;--c3:#7c2d12}.c-slate{--c1:#94a3b8;--c2:#475569;--c3:#1e293b}

  /* ---------- panels ---------- */
  #xpanel{position:absolute;right:12px;top:68px;width:min(440px,calc(100vw - 24px));max-height:calc(100% - 180px);min-height:120px;display:flex;flex-direction:column;background:var(--solid);border:1px solid var(--line2);border-radius:22px;box-shadow:0 24px 60px rgba(0,0,0,.55),var(--hi);pointer-events:auto;z-index:3;overflow:hidden;animation:slideIn .2s ease-out}
  #xpanel[hidden]{display:none}
  .xp-head{flex:none;display:flex;align-items:center;gap:10px;padding:12px 12px 12px 16px;background:linear-gradient(180deg,rgba(8,10,15,.25),rgba(8,10,15,.55)),var(--exp);border-bottom:1px solid rgba(0,0,0,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
  .xp-head b{flex:1;min-width:0;font:600 21px/1.15 var(--fh);letter-spacing:.01em;text-shadow:0 2px 0 rgba(0,0,0,.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #xpExtra{display:flex;gap:6px;align-items:center}
  #xpExtra:empty{display:none}
  .chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 8px;border-radius:999px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.14);font:600 14px var(--fh);white-space:nowrap}
  #xpClose{flex:none;width:36px;height:36px;border-radius:11px;border:0;cursor:pointer;color:#fff;font:700 16px var(--fh);background:linear-gradient(180deg,#f87171,#dc2626);box-shadow:0 3px 0 #7f1d1d,inset 0 1px 0 rgba(255,255,255,.35);text-shadow:0 1px 0 rgba(0,0,0,.35);transition:transform .08s}
  #xpClose:hover{filter:brightness(1.1)}
  #xpClose:active{transform:translateY(2px);box-shadow:0 1px 0 #7f1d1d}
  #xpBody{flex:1;min-height:0;overflow:auto;padding:12px 14px 16px;overscroll-behavior:contain}
  #xpBody::-webkit-scrollbar,.egrid::-webkit-scrollbar{width:10px}
  #xpBody::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:6px;border:2px solid transparent;background-clip:padding-box}
  #xpBody h4{font:600 17px var(--fh);margin:16px 0 8px}
  /* full-screen menus */
  #xpanel.full{inset:0;width:auto;max-height:none;border-radius:0;border:0;background:radial-gradient(1100px 520px at 50% -10%,rgba(255,255,255,.08),transparent 70%),linear-gradient(180deg,#141a25,#0b0e14);animation:pop .18s ease-out;z-index:4}
  #xpanel.full .xp-head{padding:14px 18px 14px 22px}
  #xpanel.full .xp-head b{font-size:28px}
  #xpanel.full #xpClose{width:42px;height:42px;font-size:19px;border-radius:13px}
  #xpanel.full #xpBody{padding:18px 22px 26px}
  .xp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:10px}
  .xp-card{position:relative;background:linear-gradient(180deg,#2a3344,#1c222d);border:2px solid rgba(255,255,255,.07);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:5px;font:700 12px/1.35 var(--fb);color:#cbd5e1;box-shadow:0 3px 0 rgba(0,0,0,.35),var(--hi);transition:transform .12s,border-color .12s}
  .xp-card:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.16)}
  .xp-card b{color:#fff;font:600 14.5px/1.15 var(--fh);letter-spacing:.01em}
  .xp-card .big{font-size:36px;height:62px;display:grid;place-items:center;border-radius:12px;background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.16),rgba(255,255,255,.02) 68%);filter:drop-shadow(0 3px 0 rgba(0,0,0,.25));margin-bottom:2px}
  .xp-card .xp-btn{margin-top:auto}
  .xp-card.on{border-color:#22c55e;background:linear-gradient(180deg,#1d4a33,#142b1e);box-shadow:0 0 0 3px rgba(34,197,94,.22),0 3px 0 rgba(0,0,0,.35)}
  .xp-card.on::after{content:'✓';position:absolute;top:-9px;right:-9px;width:26px;height:26px;border-radius:50%;background:linear-gradient(180deg,#4ade80,#16a34a);border:2px solid #fff;display:grid;place-items:center;font:700 13px/1 var(--fh);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.35)}
  .xp-btn{--c1:#4ade80;--c2:#16a34a;--c3:#14532d;border:0;border-radius:12px;padding:9px 14px 10px;background:linear-gradient(180deg,var(--c1),var(--c2));color:#fff;font:600 14px/1.1 var(--fh);letter-spacing:.01em;text-shadow:0 1.5px 0 rgba(0,0,0,.35);cursor:pointer;box-shadow:0 4px 0 var(--c3),inset 0 1px 0 rgba(255,255,255,.35),0 6px 12px rgba(0,0,0,.2);transition:transform .08s,filter .15s,box-shadow .08s;white-space:nowrap}
  .xp-btn:hover{filter:brightness(1.08)}
  .xp-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--c3),inset 0 1px 0 rgba(255,255,255,.3)}
  .xp-btn.alt{--c1:#64748b;--c2:#475569;--c3:#1e293b}
  .xp-btn.red{--c1:#f87171;--c2:#dc2626;--c3:#7f1d1d}
  .xp-btn.gold{--c1:#fcd34d;--c2:#f59e0b;--c3:#92400e}
  .xp-btn.blue{--c1:#60a5fa;--c2:#2563eb;--c3:#1e3a8a}
  .xp-btn.purple{--c1:#c084fc;--c2:#9333ea;--c3:#581c87}
  .xp-btn:disabled{filter:grayscale(.75) brightness(.75);opacity:.6;cursor:default}
  .xp-btn:disabled:active{transform:none;box-shadow:0 4px 0 var(--c3),inset 0 1px 0 rgba(255,255,255,.35)}
  .xp-row{display:flex;align-items:center;gap:10px;justify-content:space-between;background:linear-gradient(180deg,#283143,#1d2431);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:9px 12px;margin:7px 0;font:700 13.5px/1.35 var(--fb);box-shadow:0 2px 0 rgba(0,0,0,.28)}
  .xp-row b{font-family:var(--fh);font-weight:600;letter-spacing:.01em}
  .xp-row small{font-weight:700}
  .xp-row .lft{display:flex;align-items:center;gap:10px;min-width:0}
  .ico{display:inline-grid;place-items:center;width:40px;height:40px;flex:none;border-radius:12px;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.16),rgba(255,255,255,.04));font-size:23px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
  .xp-note{color:var(--muted);font:700 12.5px/1.5 var(--fb);margin:6px 0}
  .xp-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px;padding:4px;border-radius:14px;background:rgba(0,0,0,.3);border:1px solid var(--line)}
  .xp-tabs button{flex:1;border:0;border-radius:10px;padding:8px 10px;background:transparent;color:#cbd5e1;font:600 13px var(--fh);cursor:pointer;white-space:nowrap;transition:background .12s}
  .xp-tabs button:hover{background:rgba(255,255,255,.07)}
  .xp-tabs button.on{background:linear-gradient(180deg,#fff,#e2e8f0);color:#0f172a;box-shadow:0 2px 0 #94a3b8}
  .meter{height:10px;border-radius:6px;background:rgba(0,0,0,.45);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
  .meter i{display:block;height:100%;border-radius:6px;background:linear-gradient(180deg,#86efac,#22c55e);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
  .r1{color:#cbd5e1}.r2{color:#4ade80}.r3{color:#60a5fa}.r4{color:#c084fc}.r5{color:#fbbf24}.r6{color:#f87171}

  /* ---------- leaderboard, banner, stats, toasts, chat ---------- */
  #meter{position:absolute;right:12px;top:60px;display:flex;align-items:center;gap:12px;height:30px;padding:0 12px;border-radius:999px;font:600 13px var(--fh);white-space:nowrap;pointer-events:auto;cursor:default}
  #meter[hidden]{display:none}
  #meter span{display:flex;align-items:center;gap:5px}
  #meter i{width:8px;height:8px;border-radius:50%;background:#94a3b8}
  #meter .good i{background:#4ade80;box-shadow:0 0 6px #4ade80}
  #meter .ok i{background:#facc15;box-shadow:0 0 6px #facc15}
  #meter .bad i{background:#f87171;box-shadow:0 0 6px #f87171}
  #meter small{font:700 10.5px var(--fb);color:var(--dim);letter-spacing:.03em}
  #meter.phone{left:12px;right:auto;top:106px;height:26px;gap:9px;padding:0 10px;font-size:12px}
  #board{position:absolute;right:12px;top:12px;min-width:210px;max-width:46vw;border-radius:16px;font:700 13.5px var(--fb);overflow:hidden}
  #board table{border-collapse:collapse;width:100%}
  #board th{font:600 11px var(--fh);text-transform:uppercase;letter-spacing:.09em;color:#cbd5e1;text-align:left;padding:8px 12px 7px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border-bottom:1px solid var(--line)}
  #board td{padding:5px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
  #board tr:nth-child(odd) td{background:rgba(255,255,255,.025)}
  #board td:last-child,#board th:last-child{text-align:right;font-family:var(--fh);font-weight:600}
  #board .rk{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:6px;background:rgba(255,255,255,.1);font:600 11px var(--fh);margin-right:8px;vertical-align:1px}
  #board tr:nth-child(2) .rk{background:linear-gradient(180deg,#fde047,#f59e0b);color:#422006}
  #board tr:nth-child(3) .rk{background:linear-gradient(180deg,#e2e8f0,#94a3b8);color:#1e293b}
  #board tr:nth-child(4) .rk{background:linear-gradient(180deg,#fdba74,#c2410c);color:#431407}
  #board tr.me td{color:#7dd3fc;background:rgba(56,189,248,.15)}
  #banner{position:absolute;left:50%;top:12px;transform:translateX(-50%);padding:10px 22px;border-radius:16px;font:600 18px/1.25 var(--fh);letter-spacing:.01em;text-align:center;max-width:min(560px,calc(100vw - 720px));text-shadow:0 2px 0 rgba(0,0,0,.4);border:1px solid var(--line2)}
  @media (max-width:1180px){#banner{top:68px;max-width:min(560px,86vw)}}
  #banner:empty{display:none}
  #stat{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);padding:8px 18px;border-radius:999px;font:600 16px var(--fh);letter-spacing:.01em;white-space:nowrap;text-shadow:0 1.5px 0 rgba(0,0,0,.4)}
  #stat:empty{display:none}
  #stat small{font-weight:600;color:#86efac;margin-left:6px}
  #toast{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%);font:700 36px/1.15 var(--fh);letter-spacing:.01em;-webkit-text-stroke:7px rgba(10,12,18,.75);paint-order:stroke fill;text-shadow:0 5px 0 rgba(0,0,0,.35);opacity:0;transition:opacity .3s;text-align:center;white-space:nowrap}
  #toast.pop{animation:toastPop .35s ease-out}
  #chatlog{position:absolute;left:12px;top:68px;width:min(380px,56vw);display:flex;flex-direction:column;gap:3px;font:700 13.5px/1.35 var(--fb)}

  /* ---------- pause & loading ---------- */

  .btn{--c1:#64748b;--c2:#475569;--c3:#1e293b;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;margin:10px 0;border:0;border-radius:14px;background:linear-gradient(180deg,var(--c1),var(--c2));color:#fff;font:600 17px/1.1 var(--fh);letter-spacing:.01em;text-shadow:0 1.5px 0 rgba(0,0,0,.35);cursor:pointer;box-shadow:0 5px 0 var(--c3),inset 0 1px 0 rgba(255,255,255,.3),0 8px 16px rgba(0,0,0,.2);transition:transform .08s,filter .15s,box-shadow .08s}

  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--c3),inset 0 1px 0 rgba(255,255,255,.3)}
  .btn:disabled{opacity:.5;cursor:default;filter:grayscale(.6)}
  .btn.play{--c1:#4ade80;--c2:#16a34a;--c3:#14532d}
  .btn.red{--c1:#f87171;--c2:#dc2626;--c3:#7f1d1d}
  .btn.blue{--c1:#60a5fa;--c2:#2563eb;--c3:#1e3a8a}
  .btn kbd{background:rgba(0,0,0,.3);color:#fff}
  kbd{display:inline-block;background:#2b3444;border-radius:6px;padding:1px 7px;font:600 12px var(--fh);color:#e2e8f0;box-shadow:0 2px 0 #111827;margin:0 1px}
  #loading{background:linear-gradient(180deg,rgba(6,8,12,.55),rgba(6,8,12,.9)),var(--exp)}
  #loading .panel{text-align:center;background:rgba(12,15,21,.72)}
  .lbar{height:10px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:6px;position:relative}
  .lbar i{position:absolute;top:0;bottom:0;width:40%;border-radius:6px;background:linear-gradient(90deg,transparent,#4ade80,transparent);animation:shimmer 1.1s linear infinite}
  .spin .mark{width:30px;height:30px;animation:spin 1s cubic-bezier(.6,.1,.3,1) infinite}

  /* ---------- home ---------- */
  #home{background:radial-gradient(1100px 600px at 12% -10%,rgba(59,130,246,.16),transparent 62%),radial-gradient(900px 520px at 105% 0%,rgba(168,85,247,.13),transparent 60%),radial-gradient(800px 500px at 50% 120%,rgba(34,197,94,.08),transparent 60%),var(--bg);display:block;padding:0}
  #home[hidden]{display:none}
  .homewrap{max-width:1120px;margin:0 auto;padding:20px 20px 44px}
  .hbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}

  .hcard{background:var(--solid);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--drop),var(--hi)}

  .sect small{color:var(--dim);font:700 12.5px var(--fb)}
  .avstage{position:relative;border-radius:16px;overflow:hidden;background:radial-gradient(circle at 50% 30%,rgba(125,211,252,.22),transparent 60%),linear-gradient(180deg,#1e293b,#0f172a);margin-bottom:10px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
  .avstage::after{content:'';position:absolute;left:18%;right:18%;bottom:8%;height:12%;border-radius:50%;background:radial-gradient(ellipse,rgba(125,211,252,.35),transparent 70%);pointer-events:none}

  .shop{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .shop button{position:relative;background:linear-gradient(180deg,#283143,#1c222d);border:2px solid rgba(255,255,255,.07);border-radius:14px;color:#e2e8f0;padding:8px 4px 6px;cursor:pointer;font:600 11px/1.15 var(--fh);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:84px;box-shadow:0 3px 0 rgba(0,0,0,.35);transition:transform .12s,border-color .12s}

  .shop button .i{font-size:27px;line-height:1.1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}
  .shop button .pr{margin-top:auto;color:#fde68a;font:600 11px var(--fh);background:rgba(0,0,0,.35);border-radius:999px;padding:2px 8px}
  .shop button .pr.own{color:#86efac}
  .shop button.on{border-color:#22c55e;background:linear-gradient(180deg,#1d4a33,#142b1e)}
  .shop button.cant{opacity:.5}

  .opt{margin:10px 0}

  .sw button.on{border-color:#fff;box-shadow:0 0 0 3px #22c55e,0 2px 0 rgba(0,0,0,.35)}
  /* the featured experience */
  .feat{position:relative;overflow:hidden;display:grid;grid-template-columns:1fr auto;align-items:end;gap:16px;min-height:200px;border-radius:24px;padding:22px 24px;margin-bottom:22px;background:var(--exp);box-shadow:var(--drop),inset 0 0 0 1px rgba(255,255,255,.14);cursor:pointer;border:0;color:#fff;text-align:left;width:100%;font:inherit}

  .feat .art{position:absolute;right:190px;top:calc(50% - 74px);font-size:118px;line-height:1;filter:drop-shadow(0 8px 0 rgba(0,0,0,.25));animation:bob 4s ease-in-out infinite;z-index:1}

  .feat h2{margin:10px 0 6px;font:700 34px/1.05 var(--fh);letter-spacing:.01em;text-shadow:0 3px 0 rgba(0,0,0,.35)}

  .feat .meta{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .pill{display:inline-flex;align-items:center;gap:5px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:4px 10px;font:600 12px var(--fh);white-space:nowrap}
  .pill .dot{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80}
  .playbig{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-width:150px;height:62px;padding:0 26px;border:0;border-radius:18px;background:linear-gradient(180deg,#4ade80,#16a34a);color:#fff;font:700 24px var(--fh);letter-spacing:.02em;text-shadow:0 2px 0 rgba(0,0,0,.3);box-shadow:0 5px 0 #0f6b30,inset 0 2px 0 rgba(255,255,255,.4);cursor:pointer;animation:glow 2.2s ease-in-out infinite;transition:transform .08s,filter .15s}

  @media (max-width:900px){.feat .art{display:none}}
  @media (max-width:560px){.feat{grid-template-columns:1fr;padding:18px}.feat h2{font-size:28px}.playbig{width:100%}.homewrap{padding:16px 16px 40px}.srow{flex-wrap:wrap}.srow .bar{min-width:100%;order:3}}
  /* the experience cards */
  .egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
  .ecard{position:relative;background:var(--solid);border:1px solid var(--line);border-radius:18px;color:#fff;text-align:left;padding:0;cursor:pointer;overflow:hidden;font:inherit;box-shadow:0 4px 0 rgba(0,0,0,.35),var(--hi);transition:transform .15s,box-shadow .15s,border-color .15s}

  .thumb{position:relative;overflow:hidden;height:124px;display:grid;place-items:center}

  .ecard:hover .thumb .em{transform:scale(1.14) rotate(-6deg)}
  .thumb .pill{position:absolute;z-index:2;left:8px;bottom:8px;font-size:11px;padding:3px 8px}
  .thumb .genre{left:auto;bottom:auto;right:8px;top:8px;background:rgba(255,255,255,.9);color:#0f172a;border:0;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
  .ecard .info{padding:10px 12px 12px}
  /* sorting and filtering the experiences */
  .xtools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 10px}

  .favbig{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:999px;color:#fff;font:600 14px var(--fh);padding:10px 16px;cursor:pointer;margin-left:8px}

  .ecard b{display:block;font:600 16px/1.15 var(--fh);letter-spacing:.01em}

  .edetail{background:var(--solid);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--drop),var(--hi);animation:rise .2s ease-out}
  .edetail .top{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}

  .back{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;color:#cbd5e1;font:600 13.5px var(--fh);cursor:pointer;padding:6px 14px;margin-bottom:14px;transition:background .12s}

  .srow b{font:600 15px var(--fh);min-width:76px}
  .srow .cnt{min-width:56px;color:var(--muted);font:600 13px var(--fh)}
  .srow .bar{flex:1;height:10px;background:rgba(0,0,0,.4);border-radius:6px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}

  @media (max-width:640px){
    .xp-head{flex-wrap:wrap}
    #xpExtra{order:3;width:100%;flex-wrap:wrap}

  }
</style>
</head>

      let ta = (b[a] - o[a]) / d[a], tb = (b[a + 3] - o[a]) / d[a]; if (ta > tb) { const q = ta; ta = tb; tb = q; }
      if (ta > t0) t0 = ta; if (tb < t1) t1 = tb; if (t0 > t1) hit = false;
    }
    if (hit && t0 > 0.2 && t0 < best) best = t0;
  }
  return best;
}
function drawHud() {
  const rows = crew().map((c) => ({ c, name: c.isMe ? Net.name : String(c.pr.nm || 'Player').slice(0, 20), v: exp.statOf(c.pr, c.isMe, c.peer), k: exp.sortKey(c.pr, c.isMe, c.peer) })).sort((a, b) => b.k - a.k);
  $('#board').innerHTML = `<table><tr><th>👥 ${rows.length} player${rows.length === 1 ? '' : 's'}</th><th>${exp.stat}</th></tr>${rows.map((r, i) => `<tr class="${r.c.isMe ? 'me' : ''}"><td><span class="rk">${i + 1}</span>${esc(r.name)}</td><td>${esc(String(r.v))}</td></tr>`).join('')}</table>`;
  $('#stat').innerHTML = exp.hud ? exp.hud() : '';
  if (!exp.banner) setBanner('');
  if (Meter.shown) placeMeter(); // the leaderboard may have grown or shrunk
}

// every button in the HUD, menus and home screen clicks
document.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b && !b.disabled && b.id !== 'xpClose') sfx('click', { gap: 30 }); }, true);

/* ---------------- start ---------------- */
try { loadAvFrom(JSON.parse(localStorage.getItem('rb.av') || 'null')); } catch (e) {}
drawAvatarOpts(); drawExps();
requestAnimationFrame(frame);
window.__rb = { P, Net, cam, camera, scene, renderer, keys, EXPS, Meter, GFX, gfxApply, softGL, sunL, sunSprite, makeAvatar, join, leave, die, respawn, parts: () => parts, exp: () => exp, me: () => me, iAmHost, crew, players, get AV() { return AV; }, W, earn, spend, roundState, openPanel, closePanel, pickPlane, myPeer, grantCosmetic, snapshot }; // for tests
if (!Net.api()) homeStatus('Open Bloxverse from 🕹️ Games in the chat to play online.');
else {
  $('#hi').textContent = 'Connecting…';
  lobby().then(async (r) => {
    if (!r) { $('#hi').textContent = ''; homeStatus('Live rooms aren’t switched on for your access to this page. The owner can share it with you as a Contributor (Share menu).'); return; }
    $('#hi').textContent = `Hi, ${Net.name}!`;
    const saved = await kvGet('av');
    if (saved && typeof saved === 'object' && (+saved.at || 0) >= (W.at || 0)) loadAvFrom(saved);
    W.loaded = true;
    const today = new Date().toISOString().slice(0, 10);
    if (W.day !== today) { W.day = today; W.coins += 50; $('#hi').textContent = `Hi, ${Net.name}! Daily bonus: +50 🪙`; }
    saveAv(); drawAvatarOpts(); pvAvatar(); drawExps();
  });
}
