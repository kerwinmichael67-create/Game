<!doctype html>
<html lang="en">
<head>
<script src="net.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blockcraft</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:#000;font-family:"Trebuchet MS",system-ui,sans-serif;color:#fff;user-select:none}
  canvas#view{display:block;width:100%;height:100%}
  .ui{position:fixed;pointer-events:none}
  #cross{left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px}
  #cross:before,#cross:after{content:'';position:absolute;background:rgba(255,255,255,.85);mix-blend-mode:difference}
  #cross:before{left:10px;top:0;width:2px;height:22px}
  #cross:after{top:10px;left:0;height:2px;width:22px}
  #hotbar{left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:4px;padding:4px;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.25);border-radius:6px;pointer-events:auto}
  .slot{width:50px;height:50px;border:2px solid rgba(255,255,255,.2);border-radius:4px;display:grid;place-items:center;position:relative;cursor:pointer;background:rgba(0,0,0,.25)}
  .slot.on{border-color:#fff;box-shadow:0 0 0 2px #000 inset}
  .slot canvas{width:34px;height:34px;image-rendering:pixelated}
  .slot small{position:absolute;left:3px;top:1px;font-size:10px;opacity:.7}
  #slotName{left:50%;bottom:80px;transform:translateX(-50%);font-weight:700;text-shadow:0 2px 0 #000;opacity:0;transition:opacity .3s}
  #info{left:10px;top:10px;font-size:13px;line-height:1.5;text-shadow:0 1px 0 #000;background:rgba(0,0,0,.3);padding:6px 10px;border-radius:6px}
  #chatlog{left:10px;bottom:80px;width:min(420px,60vw);display:flex;flex-direction:column;gap:2px;font-size:14px}
  #chatlog div{background:rgba(0,0,0,.45);padding:3px 8px;border-radius:4px;text-shadow:0 1px 0 #000;transition:opacity 1s}
  #chatlog div.old{opacity:0}
  #chatbox{left:10px;bottom:60px;width:min(420px,60vw);pointer-events:auto;display:none}
  #chatbox input{width:100%;padding:8px 10px;border:0;border-radius:4px;background:rgba(0,0,0,.65);color:#fff;font:15px inherit;outline:2px solid rgba(255,255,255,.3)}
  .screen{position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,14,20,.55);backdrop-filter:blur(2px);pointer-events:auto;overflow:auto;padding:16px}
  .screen[hidden]{display:none}
  .panel{width:min(640px,100%);background:#2b2b2b;border:4px solid #111;box-shadow:inset 0 0 0 3px #555;padding:20px;display:grid;gap:12px;image-rendering:pixelated}
  .logo{font:900 52px/1 "Trebuchet MS",system-ui;text-align:center;letter-spacing:.04em;color:#e9e9e9;text-shadow:4px 4px 0 #3a3a3a,0 0 18px rgba(124,252,0,.35)}
  .logo b{color:#7cfc00}
  .sub{text-align:center;color:#bbb;margin:-4px 0 4px}
  .mbtn{display:block;width:100%;padding:12px;border:3px solid #111;background:linear-gradient(#8a8a8a,#6b6b6b);color:#fff;font:700 18px inherit;text-shadow:2px 2px 0 #333;cursor:pointer;box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.35)}
  .mbtn:hover:not(:disabled){background:linear-gradient(#9ab07f,#6f8f52);outline:2px solid #fff}
  .mbtn:disabled{opacity:.5;cursor:default}
  .mbtn.green{background:linear-gradient(#6fbf3b,#3f8a1f)}
  .worlds{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
  .world{padding:10px;border:3px solid #111;background:#3c3c3c;color:#fff;cursor:pointer;text-align:left;font:inherit;box-shadow:inset 0 2px 0 rgba(255,255,255,.15)}
  .world:hover:not(:disabled){outline:2px solid #fff}
  .world b{display:block;font-size:16px}
  .world small{color:#bbb}
  .note{color:#aaa;font-size:13px;margin:0;line-height:1.5}
  .note kbd{background:#444;border:1px solid #666;border-bottom-width:2px;border-radius:3px;padding:0 5px;font:12px monospace;color:#fff}
  .status{background:#5a4a1a;border:2px solid #c9a227;padding:8px 10px;font-size:14px}
  .palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
  .pal{border:3px solid #111;background:#3c3c3c;padding:6px 2px;cursor:pointer;display:grid;justify-items:center;gap:3px;font-size:11px;color:#ddd}
  .pal:hover{outline:2px solid #fff}
  .pal canvas{width:36px;height:36px;image-rendering:pixelated}
  #bars{left:50%;bottom:72px;transform:translateX(-50%);width:470px;display:none;justify-content:space-between;font-size:15px;text-shadow:0 1px 0 #000;letter-spacing:-1px}
  #bars span i{font-style:normal}
  .heart{color:#e3262b}.heart.half{color:#e98b8d}.heart.empty{color:rgba(0,0,0,.45)}
  .food{color:#c8822b}.food.half{color:#e0b07a}.food.empty{color:rgba(0,0,0,.45)}
  .slot b.count{position:absolute;right:3px;bottom:0;font-size:13px;text-shadow:1px 1px 0 #000}
  #hurt{inset:0;background:radial-gradient(circle,transparent 45%,rgba(200,0,0,.55));opacity:0;transition:opacity .4s}
  #mineBar{left:50%;top:calc(50% + 20px);width:60px;height:5px;margin-left:-30px;background:rgba(0,0,0,.5);display:none}
  #mineBar i{display:block;height:100%;background:#fff;width:0}
  .invwrap{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:640px){.invwrap{grid-template-columns:1fr}}
  .invgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:5px;align-content:start}
  .inv{position:relative;border:3px solid #111;background:#3c3c3c;padding:4px;cursor:pointer;display:grid;place-items:center}
  .inv:hover{outline:2px solid #fff}
  .inv canvas{width:34px;height:34px;image-rendering:pixelated}
  .inv b{position:absolute;right:3px;bottom:1px;font-size:12px;text-shadow:1px 1px 0 #000}
  .recipes{display:grid;gap:5px;max-height:52vh;overflow:auto;padding-right:4px}
  .rec{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:8px;border:3px solid #111;background:#3c3c3c;padding:4px 8px;font-size:13px}
  .rec canvas{width:30px;height:30px;image-rendering:pixelated}
  .rec small{color:#bbb;display:block}
  .rec button{padding:6px 10px;border:3px solid #111;background:linear-gradient(#6fbf3b,#3f8a1f);color:#fff;font:700 13px inherit;cursor:pointer}
  .rec button:disabled{background:#555;color:#999;cursor:default}
  .modes{display:flex;gap:8px}
  .modes button{flex:1}
  .modes button.on{outline:3px solid #fff;background:linear-gradient(#6fbf3b,#3f8a1f)}
  #loading{position:fixed;inset:0;display:grid;place-items:center;background:#1b1b1b;font:700 20px inherit;z-index:9}
  #loading[hidden]{display:none}
  .bar{width:280px;height:12px;border:2px solid #fff;margin-top:12px}
  .bar i{display:block;height:100%;width:0;background:#7cfc00}
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="cross" class="ui"></div>
<div id="info" class="ui"></div>
<div id="slotName" class="ui"></div>
<div id="hotbar" class="ui"></div>
<div id="chatlog" class="ui"></div>
<div id="bars" class="ui"><span id="hearts"></span><span id="foods"></span></div>
<div id="hurt" class="ui"></div>
<div id="mineBar" class="ui"><i></i></div>
<div id="inventory" class="screen" hidden><div class="panel" style="width:min(820px,100%)"><b style="font-size:20px">Inventory & crafting</b><p class="note">Click an item to put it in the selected hotbar slot. Smelting needs coal. <kbd>E</kbd> or <kbd>Esc</kbd> closes.</p><div class="invwrap"><div class="invgrid" id="invGrid"></div><div class="recipes" id="recipes"></div></div></div></div>
<div id="dead" class="screen" hidden><div class="panel" style="text-align:center"><div class="logo" style="font-size:44px;color:#ff6b6b">You died!</div><p class="note" id="deadWhy" style="font-size:15px"></p><button class="mbtn green" id="respawnBtn">Respawn</button><p class="note">You keep your inventory.</p></div></div>
<div id="chatbox" class="ui"><input id="chatin" maxlength="120" placeholder="Say something… (Enter to send, Esc to cancel)" autocomplete="off"></div>
<div id="menu" class="screen"><div class="panel" id="menuPanel"></div></div>
<div id="pause" class="screen" hidden><div class="panel" id="pausePanel"></div></div>
<div id="pick" class="screen" hidden><div class="panel"><b style="font-size:20px">Blocks</b><p class="note">Click a block to put it in the selected hotbar slot. <kbd>E</kbd> or <kbd>Esc</kbd> closes.</p><div class="palette" id="palette"></div></div></div>
<div id="loading" hidden><div style="text-align:center"><div id="loadText">Building the world…</div><div class="bar"><i id="loadBar"></i></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
/* =====================================================================
   BLOCKCRAFT — a blocky building game. Every server is its own world,
   generated from that server's seed; what people build or dig is shared
   live with everyone on the server and saved, so it's there next time.
   ===================================================================== */
const CX = 16, H = 48, NCH = 8, W = CX * NCH, SEA = 15;
const $ = (s) => document.querySelector(s);

/* ---------------- blocks ---------------- */
// tex: [top, sides, bottom] tile numbers in the texture atlas
const B = [
  null,
  { n: 'Grass', tex: [0, 1, 2] },
  { n: 'Dirt', tex: [2, 2, 2] },
  { n: 'Stone', tex: [3, 3, 3] },
  { n: 'Cobblestone', tex: [4, 4, 4] },
  { n: 'Planks', tex: [5, 5, 5] },
  { n: 'Log', tex: [7, 6, 7] },
  { n: 'Leaves', tex: [8, 8, 8], cut: true },
  { n: 'Sand', tex: [9, 9, 9] },
  { n: 'Water', tex: [10, 10, 10], liquid: true },
  { n: 'Glass', tex: [11, 11, 11], cut: true },
  { n: 'Bricks', tex: [12, 12, 12] },
  { n: 'Snow', tex: [13, 14, 2] },
  { n: 'Bedrock', tex: [15, 15, 15] },
  { n: 'Coal Ore', tex: [16, 16, 16] },
  { n: 'Iron Ore', tex: [17, 17, 17] },
  { n: 'Gold Ore', tex: [18, 18, 18] },
  { n: 'Diamond Ore', tex: [19, 19, 19] },
  { n: 'Red Wool', tex: [20, 20, 20] },
  { n: 'Blue Wool', tex: [21, 21, 21] },
  { n: 'Yellow Wool', tex: [22, 22, 22] },
  { n: 'Green Wool', tex: [23, 23, 23] },
  { n: 'White Wool', tex: [24, 24, 24] },
  { n: 'Bookshelf', tex: [5, 25, 5] },
  { n: 'Glowstone', tex: [26, 26, 26], glow: true },
  { n: 'Stone Bricks', tex: [27, 27, 27] },
  { n: 'TNT', tex: [29, 28, 30] },
  { n: 'Pumpkin', tex: [32, 31, 32] },
];
const AIR = 0, WATER = 9, BEDROCK = 13;
const solid = (b) => b !== AIR && b !== WATER;
const seeThrough = (b) => b === AIR || B[b].cut || B[b].liquid;
const PLACEABLE = B.map((b, i) => i).filter((i) => i && i !== BEDROCK && i !== WATER).concat([WATER]);

/* ---------------- items (survival) ---------------- */
// ids below 100 are blocks; these are everything else you can carry
const IT = {
  100: { n: 'Stick' }, 101: { n: 'Coal' }, 102: { n: 'Iron Ingot' }, 103: { n: 'Gold Ingot' }, 104: { n: 'Diamond' },
  105: { n: 'Wooden Pickaxe', pick: 1 }, 106: { n: 'Stone Pickaxe', pick: 2 }, 107: { n: 'Iron Pickaxe', pick: 3 }, 108: { n: 'Diamond Pickaxe', pick: 4 },
  110: { n: 'Wooden Sword', dmg: 4 }, 111: { n: 'Stone Sword', dmg: 5 }, 112: { n: 'Iron Sword', dmg: 6 }, 113: { n: 'Diamond Sword', dmg: 7 },
  120: { n: 'Raw Porkchop', food: 3 }, 121: { n: 'Cooked Porkchop', food: 8 }, 122: { n: 'Raw Beef', food: 3 }, 123: { n: 'Steak', food: 8 },
  124: { n: 'Apple', food: 4 }, 125: { n: 'Rotten Flesh', food: 2 }, 126: { n: 'Raw Mutton', food: 2 }, 127: { n: 'Cooked Mutton', food: 6 },
  130: { n: 'Gunpowder' }, 131: { n: 'Bone' },
};
const itemName = (id) => (id < 100 ? (B[id] ? B[id].n : '?') : IT[id] ? IT[id].n : '?');
const isBlock = (id) => id > 0 && id < 100;
const RECIPES = [
  { o: [5, 4], i: [[6, 1]] }, { o: [100, 4], i: [[5, 2]] },
  { o: [105, 1], i: [[5, 3], [100, 2]] }, { o: [106, 1], i: [[4, 3], [100, 2]] }, { o: [107, 1], i: [[102, 3], [100, 2]] }, { o: [108, 1], i: [[104, 3], [100, 2]] },
  { o: [110, 1], i: [[5, 2], [100, 1]] }, { o: [111, 1], i: [[4, 2], [100, 1]] }, { o: [112, 1], i: [[102, 2], [100, 1]] }, { o: [113, 1], i: [[104, 2], [100, 1]] },
  { o: [102, 1], i: [[15, 1], [101, 1]], smelt: 1 }, { o: [103, 1], i: [[16, 1], [101, 1]], smelt: 1 }, { o: [10, 2], i: [[8, 2], [101, 1]], smelt: 1 },
  { o: [3, 2], i: [[4, 2], [101, 1]], smelt: 1 }, { o: [121, 1], i: [[120, 1], [101, 1]], smelt: 1 }, { o: [123, 1], i: [[122, 1], [101, 1]], smelt: 1 }, { o: [127, 1], i: [[126, 1], [101, 1]], smelt: 1 },
  { o: [25, 4], i: [[3, 4]] }, { o: [11, 4], i: [[4, 3], [8, 1]] }, { o: [23, 1], i: [[5, 6], [100, 3]] }, { o: [24, 1], i: [[103, 1], [101, 2]] }, { o: [26, 1], i: [[130, 2], [8, 4]] },
  { o: [18, 1], i: [[22, 1], [124, 1]] }, { o: [20, 1], i: [[22, 1], [103, 1]] }, { o: [21, 1], i: [[22, 1], [7, 2]] }, { o: [19, 1], i: [[22, 1], [101, 2]] },
  { o: [27, 1], i: [[7, 4], [124, 1]] },
];
// how long a block takes to break by hand (seconds), and what pickaxe it needs to drop anything
const HARD = { 1: 0.6, 2: 0.5, 3: 7.5, 4: 10, 5: 2, 6: 2, 7: 0.3, 8: 0.5, 10: 0.3, 11: 10, 12: 0.5, 14: 15, 15: 15, 16: 15, 17: 15, 18: 0.8, 19: 0.8, 20: 0.8, 21: 0.8, 22: 0.8, 23: 1.5, 24: 0.3, 25: 7.5, 26: 0.1, 27: 1 };
const NEEDS = { 3: 1, 4: 1, 11: 1, 14: 1, 15: 2, 16: 3, 17: 3, 25: 1 };
const PICK_SPEED = { 1: 4, 2: 7, 3: 10, 4: 14 };
function breakTime(b, pick) { const base = HARD[b] || 1; if (NEEDS[b]) return pick ? base / PICK_SPEED[pick] : base * 1.5; return base; }
function dropsOf(b, pick) {
  if (NEEDS[b] && (pick || 0) < NEEDS[b]) return [];
  if (b === 1) return [[2, 1]];
  if (b === 3) return [[4, 1]];
  if (b === 14) return [[101, 1]];
  if (b === 17) return [[104, 1]];
  if (b === 7) return Math.random() < 0.1 ? [[124, 1]] : [];
  if (b === 10 || b === WATER || b === BEDROCK) return [];
  return [[b, 1]];
}
// survival: health and food are out of 20 (10 hearts, 10 drumsticks)
const S = { mode: 'creative', hp: 20, food: 20, inv: {}, hot: [0, 0, 0, 0, 0, 0, 0, 0, 0], dead: false, fallFrom: null, foodT: 0, regenT: 0, starveT: 0, mining: null, cd: 0, eatCd: 0, dirty: false };
const survival = () => S.mode === 'survival';

/* ---------------- textures (drawn, pixel by pixel) ---------------- */
const TS = 16, AT = 16; // tile size, tiles per atlas row
const atlas = document.createElement('canvas');
atlas.width = atlas.height = TS * AT;
const ac = atlas.getContext('2d');
let rs = 7;
const rr = () => ((rs = (rs * 16807) % 2147483647) / 2147483647);
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
function px(t, x, y, c, v = 0, a = 1) {
  const [r, g, b] = typeof c === 'string' ? hex(c) : c;
  ac.fillStyle = `rgba(${Math.max(0, Math.min(255, r + v))},${Math.max(0, Math.min(255, g + v))},${Math.max(0, Math.min(255, b + v))},${a})`;
  ac.fillRect((t % AT) * TS + x, Math.floor(t / AT) * TS + y, 1, 1);
}
function noisy(t, c, amt = 18) { for (let y = 0; y < TS; y++) for (let x = 0; x < TS; x++) px(t, x, y, c, Math.round((rr() - 0.5) * amt)); }
function specks(t, c, n, size = 2) { for (let k = 0; k < n; k++) { const x = Math.floor(rr() * (TS - size)), y = Math.floor(rr() * (TS - size)); for (let a = 0; a < size; a++) for (let b = 0; b < size; b++) if (rr() < 0.85) px(t, x + a, y + b, c, Math.round((rr() - 0.5) * 20)); } }
function drawAtlas() {
  noisy(0, '#5fa83a', 26);                                     // grass top
  noisy(1, '#8b5a33', 22); for (let x = 0; x < TS; x++) { const d = 3 + Math.floor(rr() * 3); for (let y = 0; y < d; y++) px(1, x, y, '#5fa83a', Math.round((rr() - 0.5) * 24)); } // grass side
  noisy(2, '#8b5a33', 24); specks(2, '#6e4426', 8, 1);         // dirt
  noisy(3, '#7d7d7d', 20); specks(3, '#6a6a6a', 10, 2);        // stone
  noisy(4, '#777777', 14); for (let k = 0; k < 9; k++) { const x = Math.floor(rr() * 12), y = Math.floor(rr() * 12), s = 3 + Math.floor(rr() * 3); for (let a = 0; a < s; a++) { px(4, x + a, y, '#4f4f4f'); px(4, x, y + a, '#9a9a9a'); } } // cobble
  noisy(5, '#b8894f', 12); for (let y = 0; y < TS; y += 4) for (let x = 0; x < TS; x++) px(5, x, y, '#7a5630'); for (let y = 0; y < TS; y += 4) px(5, (y * 5) % 16, y + 2, '#7a5630'); // planks
  noisy(6, '#6b4a2b', 14); for (let x = 0; x < TS; x += 3) for (let y = 0; y < TS; y++) if (rr() < 0.7) px(6, x, y, '#4e3520'); // log side
  noisy(7, '#b8894f', 10); for (let r = 2; r < 8; r += 2) for (let a = 0; a < 40; a++) { const ang = a / 40 * 6.283; px(7, Math.round(7.5 + Math.cos(ang) * r), Math.round(7.5 + Math.sin(ang) * r), '#8a6237'); } for (let i = 0; i < TS; i++) { px(7, i, 0, '#6b4a2b'); px(7, i, 15, '#6b4a2b'); px(7, 0, i, '#6b4a2b'); px(7, 15, i, '#6b4a2b'); } // log top
  for (let y = 0; y < TS; y++) for (let x = 0; x < TS; x++) { if (rr() < 0.18) continue; px(8, x, y, '#3f8a2a', Math.round((rr() - 0.5) * 40)); } // leaves (holes)
  noisy(9, '#dbcf8e', 16);                                     // sand
  for (let y = 0; y < TS; y++) for (let x = 0; x < TS; x++) px(10, x, y, '#2f6fd6', Math.round(Math.sin((x + y) / 2) * 10), 0.75); // water
  for (let y = 0; y < TS; y++) for (let x = 0; x < TS; x++) { const edge = x === 0 || y === 0 || x === 15 || y === 15; if (edge) px(11, x, y, '#dff6ff'); else if ((x - y === 3 || x - y === 4) && x > 3 && x < 12) px(11, x, y, '#ffffff', 0, 0.8); } // glass
  noisy(12, '#9c4a3c', 14); for (let y = 0; y < TS; y++) for (let x = 0; x < TS; x++) { if (y % 4 === 3 || ((x + (Math.floor(y / 4) % 2) * 4) % 8 === 7)) px(12, x, y, '#cbbfb0', Math.round((rr() - 0.5) * 10)); } // bricks
  noisy(13, '#f4f8ff', 8);                                     // snow top
  noisy(14, '#8b5a33', 22); for (let x = 0; x < TS; x++) { const d = 3 + Math.floor(rr() * 3); for (let y = 0; y < d; y++) px(14, x, y, '#f4f8ff', Math.round((rr() - 0.5) * 8)); } // snow side
  noisy(15, '#3a3a3a', 40);                                    // bedrock
  [[16, '#1c1c1c'], [17, '#d8a77f'], [18, '#f5d442'], [19, '#5de0e6']].forEach(([t, c]) => { noisy(t, '#7d7d7d', 20); specks(t, c, 6, 2); }); // ores
  [[20, '#c43a31'], [21, '#3654c4'], [22, '#e6c229'], [23, '#4f9a2f'], [24, '#eeeeee']].forEach(([t, c]) => { noisy(t, c, 16); for (let y = 0; y < TS; y++) for (let x = 0; x < TS; x++) if ((x + y * 3) % 7 === 0) px(t, x, y, c, -18); }); // wool
  noisy(25, '#b8894f', 10); for (let row = 0; row < 2; row++) for (let k = 0; k < 7; k++) { const c = ['#a33', '#36a', '#3a5', '#c93', '#639', '#2aa', '#a63'][Math.floor(rr() * 7)]; for (let y = 2 + row * 7; y < 7 + row * 7; y++) { px(25, 1 + k * 2, y, c); px(25, 2 + k * 2, y, c, -20); } } // bookshelf
  noisy(26, '#e8c35b', 30); specks(26, '#fff3b0', 8, 2);        // glowstone
  noisy(27, '#7a7a7a', 12); for (let y = 0; y < TS; y++) for (let x = 0; x < TS; x++) if (y % 8 === 7 || ((x + (Math.floor(y / 8) % 2) * 8) % 16 === 15)) px(27, x, y, '#555'); // stone bricks

}
let toastTimer = 0;
function toast(t) { const n = $('#slotName'); n.textContent = t; n.style.opacity = 1; clearTimeout(toastTimer); toastTimer = setTimeout(() => (n.style.opacity = 0), 1500); }
function openChat() {
  const box = $('#chatbox'), inp = $('#chatin');
  box.style.display = 'block'; unlock(); inp.value = ''; setTimeout(() => inp.focus(), 0);
  for (const k in keys) keys[k] = false;
}
$('#chatin').addEventListener('keydown', (e) => {
  e.stopPropagation();
  if (e.key === 'Enter') { const t = e.target.value.trim(); if (t) { Net.chat(t); say(`<${Net.name}> ${t}`); } closeChat(); }
  if (e.key === 'Escape') closeChat();
});
function closeChat() { $('#chatbox').style.display = 'none'; $('#chatin').blur(); lock(); }

/* =====================================================================
   ONLINE — one live room per world. Everyone shares where they are and
   the blocks they changed (in their presence); whoever has been in the
   world longest also saves it every few seconds.
   ===================================================================== */
const SERVERS = 6, MAXP = 12;
const WORLD_NAMES = ['Greenvale', 'Stoneridge', 'Sunny Shores', 'Pinewood', 'Frostpeak', 'Mossy Hollow'];
const Net = {
  name: 'Steve', color: '#3b82f6', lobby: null, lobbyPeers: [], room: null, srv: 0, peers: [], t0: 0, joinAt: 0, claimed: false,
  out: [], seq: 0, chats: [], cseq: 0, hits: [], hseq: 0, seen: new Map(), avatars: new Map(), busy: false, queued: null, sentAt: 0, lastPos: '', loaded: false, saveAt: 0, savedAt: 0,
  api: () => window.ChatClaude || window.claude,
  edit(x, y, z, b) { this.out.push([++this.seq, x, y, z, b]); if (this.out.length > 40) this.out.shift(); this.dirty = true; },
  chat(t) { this.chats.push([++this.cseq, t.slice(0, 120)]); if (this.chats.length > 3) this.chats.shift(); this.dirty = true; },
};
function send(patch) {
  if (!Net.room) return;
  if (Net.busy) { Net.queued = Object.assign(Net.queued || {}, patch); return; }
  Net.busy = true;
  const room = Net.room;
  room.presence(patch).catch(() => {}).then(() => { Net.busy = false; if (Net.queued && Net.room === room) { const q = Net.queued; Net.queued = null; send(q); } });
}
let lobbyP = null;
function lobby() {
  if (!lobbyP) lobbyP = (async () => {
    const c = Net.api(), room = c && await c.use('room');
    if (!room) { lobbyP = null; return null; }
    Net.lobby = room;
    room.onPeers((ch) => { Net.lobbyPeers = ch.peers; if (!playing) menu(); }, () => {});
    try { const u = await c.use('user'), me = u && await u.me(); if (me && me.name) Net.name = String(me.name).slice(0, 16); if (me && me.color) Net.color = me.color; } catch (e) {}
    return room;
  })();
  return lobbyP;
}
function counts() { const c = new Array(SERVERS + 1).fill(0); Net.lobbyPeers.forEach((p) => { const n = p.presence && p.presence.srv; if (n >= 1 && n <= SERVERS) c[n]++; }); return c; }
const crew = () => Net.peers.filter((p) => p.presence && p.presence.t).map((p) => ({ peer: p.peer, isMe: p.isMe, pr: p.presence, t: +p.presence.t || 0, h: +p.presence.h || 0 }))
  .sort((a, b) => (b.h ? 1 : 0) - (a.h ? 1 : 0) || a.t - b.t || (a.peer < b.peer ? -1 : 1));
const iAmHost = () => { const c = crew(); return !!(c[0] && c[0].isMe); };

let menuStatus = '';
function menu() {
  const c = counts();
  $('#menuPanel').innerHTML = `<div class="logo">BLOCK<b>CRAFT</b></div><p class="sub">Build and explore together. Every server is its own world, and it's saved.</p>
    ${menuStatus ? `<div class="status">${menuStatus}</div>` : ''}
    ${modeButtons()}
    <button class="mbtn green" id="rnd">🎲 Join a random world</button>
    <div class="worlds">${WORLD_NAMES.map((nm, i) => `<button class="world" data-w="${i + 1}" ${c[i + 1] >= MAXP ? 'disabled' : ''}><b>${nm}</b><small>Server ${i + 1} · ${c[i + 1] >= MAXP ? 'Full' : c[i + 1] ? c[i + 1] + ' playing' : 'Nobody here'}</small></button>`).join('')}</div>
    <p class="note"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move · mouse to look · <kbd>Space</kbd> jump (double-tap or <kbd>F</kbd> to fly) · <b>left click</b> break · <b>right click</b> place · <kbd>1</kbd>–<kbd>9</kbd> or wheel pick a block · <kbd>E</kbd> blocks (survival: inventory and crafting) · <kbd>T</kbd> chat · <kbd>Ctrl</kbd> sprint</p>`;
  $('#rnd').onclick = () => { const open = []; for (let n = 1; n <= SERVERS; n++) if (c[n] < MAXP) open.push(n); join(open[Math.floor(Math.random() * open.length)] || 1); };
  $('#menuPanel').querySelectorAll('[data-w]').forEach((b) => (b.onclick = () => join(+b.dataset.w)));
  wireModes($('#menuPanel'), menu);
}
function modeButtons() {
  return `<div class="modes"><button class="mbtn ${survival() ? '' : 'on'}" data-mode="creative">🧱 Creative</button><button class="mbtn ${survival() ? 'on' : ''}" data-mode="survival">⚔️ Survival</button></div>
    <p class="note" style="margin-top:4px">${survival() ? 'Survival: collect blocks, craft tools, eat, and watch out at night — zombies, skeletons and creepers come out.' : 'Creative: every block, fly anywhere, nothing can hurt you.'}</p>`;
}
function wireModes(root, redraw) { root.querySelectorAll('[data-mode]').forEach((b) => (b.onclick = () => { setMode(b.dataset.mode); redraw(); })); }
function showPause() {
  $('#pausePanel').innerHTML = `<div class="logo" style="font-size:36px">Paused</div>
    <button class="mbtn green" id="resume">Back to the game</button>
    ${modeButtons()}
    <button class="mbtn" id="switch">Switch world</button>
    <p class="note">You're in <b>${WORLD_NAMES[Net.srv - 1] || 'a world'}</b> with ${Math.max(1, crew().length)} player${crew().length === 1 ? '' : 's'}. Click the game to look around with the mouse; <kbd>Esc</kbd> lets go of it.</p>`;
  $('#pause').hidden = false;
  $('#resume').onclick = () => lock();
  $('#switch').onclick = () => leave().then(() => { $('#pause').hidden = true; $('#menu').hidden = false; menu(); });
  wireModes($('#pausePanel'), () => { const title = $('#pausePanel .logo').textContent, play = $('#resume').textContent; showPause(); $('#pausePanel .logo').textContent = title; $('#resume').textContent = play; });
}

async function join(n) {
  menuStatus = 'Joining…'; menu();
  const lob = await lobby();
  if (!lob) { menuStatus = 'Live rooms aren’t switched on for your access to this page. The owner can share it with you as a Contributor (Share menu).'; menu(); return; }
  $('#menu').hidden = true; $('#loading').hidden = false; $('#loadText').textContent = `Generating ${WORLD_NAMES[n - 1]}…`; $('#loadBar').style.width = '10%';
  await new Promise((r) => setTimeout(r, 30));
  // the world from its seed
  generate(1000 + n * 7919);
  edits.clear(); editsDirty = false;
  chunks.forEach((c) => (c.dirty = true));
  let room;
  try { room = await lob.join('w-' + n); } catch (e) { $('#loading').hidden = true; $('#menu').hidden = false; menuStatus = 'Couldn’t reach that world. Try another.'; menu(); return; }
  Object.assign(Net, { room, srv: n, peers: [], t0: Date.now(), joinAt: performance.now(), claimed: false, out: [], seq: 0, chats: [], cseq: 0, hits: [], hseq: 0, seen: new Map(), loaded: false, mbAt: 0, mbKey: '' });
  resetMobs();
  room.onPeers(onPeers, () => {});
  send({ nm: Net.name, c: Net.color, t: Net.t0, md: survival() ? 's' : 'c' });
  lob.presence({ srv: n }).catch(() => {});
  // then everything people built there: the saved world, after the host has had a moment to save it
  $('#loadText').textContent = 'Loading what people built…'; $('#loadBar').style.width = '45%';
  await new Promise((r) => setTimeout(r, 1500));
  try { const saved = await window.ChatKV.get('world-' + n); if (saved) await applySave(saved); } catch (e) { /* no save yet, or none here */ }
  await loadMe();
  Net.loaded = true;
  for (const p of Net.peers) if (!p.isMe) applyPeer(p);
  $('#loadBar').style.width = '80%';
  for (let cz = 0; cz < NCH; cz++) for (let cx = 0; cx < NCH; cx++) buildChunk(cx, cz);
  if (!S.pos || !placeAt(S.pos)) respawn();
  S.dead = false; $('#dead').hidden = true; drawBars();
  $('#loading').hidden = true;
  playing = true;
  say(`Welcome to ${WORLD_NAMES[n - 1]}! Press T to chat.`, '#ffe066');
  showPause(); $('#pausePanel').querySelector('.logo').textContent = 'Click to play';
  $('#resume').textContent = 'Play';
}
async function leave() {
  await Promise.all([saveWorld(true), saveMe()]);
  resetMobs();
  const r = Net.room;
  Net.room = null; Net.srv = 0; playing = false;
  for (const a of Net.avatars.values()) scene.remove(a.g);
  Net.avatars.clear();
  if (Net.lobby) Net.lobby.presence({ srv: null }).catch(() => {});
  if (r) await r.leave().catch(() => {});
  unlock();
}

function onPeers(ch) {
  Net.peers = ch.peers;
  for (const p of ch.joined || []) if (!p.isMe && Net.loaded) { say(`${(p.presence && p.presence.nm) || 'Someone'} joined the world`, '#ffe066'); if (iAmHost()) Net.saveAt = 0; }
  for (const p of ch.left || []) { const a = Net.avatars.get(p.peer); if (a) { scene.remove(a.g); Net.avatars.delete(p.peer); say(`${(p.presence && p.presence.nm) || 'Someone'} left`, '#ffe066'); } }
  if (Net.loaded) for (const p of ch.peers) if (!p.isMe) applyPeer(p);
}
function applyPeer(p) {
  const pr = p.presence || {}, seen = Net.seen.get(p.peer) || { e: 0, c: 0, t: 0 };
  if (pr.t && pr.t !== seen.t) { seen.t = pr.t; seen.e = 0; seen.c = 0; } // they came back: start counting again
  for (const e of Array.isArray(pr.e) ? pr.e : []) {
    if (!Array.isArray(e) || e[0] <= seen.e) continue;
    seen.e = e[0];
    const [, x, y, z, b] = e;
    if (Number.isInteger(x) && Number.isInteger(y) && Number.isInteger(z) && B[b] !== undefined && b !== BEDROCK) setBlock(x, y, z, b, true);
  }
  for (const c of Array.isArray(pr.ch) ? pr.ch : []) { if (!Array.isArray(c) || c[0] <= seen.c) continue; seen.c = c[0]; say(`<${String(pr.nm || 'Someone').slice(0, 16)}> ${String(c[1]).slice(0, 120)}`); }
  Net.seen.set(p.peer, seen);
  if (!iAmHost() && crew()[0] && crew()[0].peer === p.peer) hostNews(p.peer, pr);
  if (Array.isArray(pr.p)) {
    let a = Net.avatars.get(p.peer);
    if (!a) { a = makeAvatar(pr.c || '#3b82f6', String(pr.nm || 'Player')); a.g.position.set(pr.p[0], pr.p[1], pr.p[2]); Net.avatars.set(p.peer, a); }
    a.target = pr.p;
  }
}
function netTick(t) {
  if (!Net.room) return;
  // who saves: whoever has been here longest claims it
  const c = crew();
  if (!Net.claimed && performance.now() - Net.joinAt > 2000 && !c.some((x) => x.h && !x.isMe) && c[0] && c[0].isMe) { Net.claimed = true; send({ h: 1 }); }
  if (t - Net.sentAt > 100) {
    const pos = [+P.x.toFixed(2), +P.y.toFixed(2), +P.z.toFixed(2), +P.yaw.toFixed(2), +P.pitch.toFixed(2)], key = pos.join();
    if (key !== Net.lastPos || Net.dirty) {
      Net.lastPos = key; Net.sentAt = t;
      const patch = { p: pos };
      if (Net.dirty) { patch.e = Net.out.slice(); patch.ch = Net.chats.slice(); patch.ht = Net.hits.slice(); Net.dirty = false; }
      send(patch);
    }
  }
  // the host tells everyone where the mobs are, about 8 times a second
  if (iAmHost() && Net.loaded && t - Net.mbAt > 125) {
    const mb = Mobs.snap || [], key = JSON.stringify(mb);
    if (key !== Net.mbKey || Mobs.evDirty) { Net.mbAt = t; Net.mbKey = key; const patch = { mb }; if (Mobs.evDirty) { patch.ev = Mobs.ev.slice(); Mobs.evDirty = false; } send(patch); }
  }
  if (S.dirty && survival() && t > (Net.meAt || 0)) { Net.meAt = t + 15000; saveMe(); }
  if (iAmHost() && Net.loaded && editsDirty && t > Net.saveAt) { Net.saveAt = t + 5000; saveWorld(); }
}
// the saved world: every changed block as "where:what" in base 36, squeezed
async function saveWorld(force) {
  if (!Net.room || !Net.loaded || (!editsDirty && !force) || !iAmHost() || !window.ChatKV) return;
  editsDirty = false;
  const parts = []; let last = 0;
  [...edits.entries()].sort((a, b) => a[0] - b[0]).forEach(([i, b]) => { parts.push((i - last).toString(36) + ':' + b.toString(36)); last = i; });
  try { await window.ChatKV.set('world-' + Net.srv, 'v1|' + await squeeze(parts.join(','))); Net.savedAt = Date.now(); }
  catch (e) { editsDirty = true; }
}
async function applySave(text) {
  if (!text.startsWith('v1|')) return;
  const list = (await unsqueeze(text.slice(3))).split(',');
  let at = 0;
  for (const part of list) {
    if (!part) continue;
    const [d, b] = part.split(':'); at += parseInt(d, 36);
    const blk = parseInt(b, 36);
    if (at >= 0 && at < world.length && B[blk] !== undefined) { world[at] = blk; edits.set(at, blk); }
  }
}
async function squeeze(text) {
  if (typeof CompressionStream === 'undefined') return 'raw:' + text;
  const buf = await new Response(new Blob([text]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer();
  let bin = ''; const b = new Uint8Array(buf);
  for (let i = 0; i < b.length; i += 0x8000) bin += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
  return btoa(bin);
}
async function unsqueeze(z) {
  if (z.startsWith('raw:')) return z.slice(4);
  const bin = atob(z), b = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
  return await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
}
addEventListener('visibilitychange', () => { if (document.hidden) saveWorld(); });
setInterval(() => saveWorld(), 20000);

/* ---------------- the loop ---------------- */
let last = performance.now(), fpsN = 0, fpsT = 0, fps = 0;
function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (t - last) / 1000), mobDt = Math.min(0.25, (t - last) / 1000); last = t;
  if (playing) {
    if (locked || dragLook) physics(dt); else { P.vx = P.vz = 0; physics(dt); }
    camera.position.set(P.x, P.y + P.eye, P.z);
    camera.rotation.set(P.pitch, P.yaw, 0, 'YXZ');
    if (locked || dragLook) act(t); else hl.visible = false;
    let built = 0;
    for (let cz = 0; cz < NCH && built < 3; cz++) for (let cx = 0; cx < NCH && built < 3; cx++) if (chunkAt(cx, cz).dirty) { buildChunk(cx, cz); built++; }
    for (const a of Net.avatars.values()) {
      if (!a.target) continue;
      const [x, y, z, yaw] = a.target, g = a.g, k = Math.min(1, dt * 12);
      const dx = x - g.position.x, dz = z - g.position.z, sp = Math.hypot(dx, dz) / Math.max(dt, 0.001);
      g.position.x += dx * k; g.position.y += (y - g.position.y) * k; g.position.z += dz * k;
      let dy = yaw - g.rotation.y; while (dy > Math.PI) dy -= Math.PI * 2; while (dy < -Math.PI) dy += Math.PI * 2; g.rotation.y += dy * k;
      a.walk += Math.min(sp, 8) * dt * 1.6;
      const sw = Math.sin(a.walk) * Math.min(1, sp / 3) * 0.7;
      a.legL.rotation.x = sw; a.legR.rotation.x = -sw; a.armL.rotation.x = -sw; a.armR.rotation.x = sw;
      a.head.rotation.x = -(a.target[4] || 0) * 0.6;
    }
    if (Net.loaded && iAmHost()) hostMobs(mobDt); else Mobs.hosting = false; // mobs keep real time even when the frame rate drops
    drawMobs(dt);
    for (let i = bits.length - 1; i >= 0; i--) { const m = bits[i], u = m.userData; u.life -= dt; u.v.y -= 12 * dt; m.position.addScaledVector(u.v, dt); if (u.life <= 0) { scene.remove(m); m.geometry.dispose(); bits.splice(i, 1); } }
    netTick(t);
    fpsN++; if (t - fpsT > 1000) { fps = fpsN; fpsN = 0; fpsT = t; }
    $('#info').innerHTML = `<b>${WORLD_NAMES[Net.srv - 1] || ''}</b> · ${Math.max(1, crew().length)} online${survival() ? ' · ⚔️ survival' : P.fly ? ' · ✈️ flying' : ''}${Mobs.snap && Mobs.snap.length ? ` · ${Mobs.snap.length} mobs` : ''}<br><small>T chat · ${survival() ? 'E inventory' : 'E blocks · F fly'} · Esc pause${showCoords ? ` · ${P.x.toFixed(1)} ${P.y.toFixed(1)} ${P.z.toFixed(1)} · ${fps} fps` : ''}</small>`;
  } else {
    // the menu: a slow fly-around of the world
    const a = t / 9000;
    camera.position.set(W / 2 + Math.cos(a) * 50, 42, W / 2 + Math.sin(a) * 50);
    camera.lookAt(W / 2, 18, W / 2);
    let built = 0;
    for (let cz = 0; cz < NCH && built < 2; cz++) for (let cx = 0; cx < NCH && built < 2; cx++) if (chunkAt(cx, cz).dirty) { buildChunk(cx, cz); built++; }
  }
  skyUpdate();
  renderer.render(scene, camera);
}

/* ---------------- start ---------------- */
try { setMode(localStorage.getItem('bc.mode') || 'creative'); } catch (e) { setMode('creative'); }
drawHotbar();
generate(1000 + 7919); // a world to look at behind the menu
requestAnimationFrame(frame);
window.__bc = { P, Net, world, get, setBlock, raycast, edits, keys, idx, mouse: mouseDown, physics, act, lock, saveWorld, S, Mobs, MOBS, give, take, setMode, spawnMob, hitMob, hurt, eat, RECIPES, drawInventory, openInventory, survival, iAmHost, saveMe, loadMe, held, select, get dayLight() { return dayLight; }, set dayLight(v) { dayLight = v; } }; // for tests
if (!Net.api()) { menuStatus = 'Open Blockcraft from 🕹️ Games in the chat to play online.'; menu(); }
else { menuStatus = 'Connecting…'; menu(); lobby().then((r) => { menuStatus = r ? '' : 'Live rooms aren’t switched on for your access to this page. The owner can share it with you as a Contributor (Share menu).'; menu(); }); }
</script>
