<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Chat</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">

<!-- Sign in / create account -->
<div id="auth" class="auth hidden">
  <form id="authForm" class="auth-card">
    <h1>🎮 Game Chat</h1>
    <p class="muted">Chat with whoever is online and challenge them to games.</p>
    <div class="tabs">
      <button type="button" class="tab active" data-mode="login">Sign in</button>
      <button type="button" class="tab" data-mode="register">Create account</button>
    </div>
    <label>Username<input id="authUser" autocomplete="username" required maxlength="20"></label>
    <label id="authNameRow" class="hidden">Name <span class="muted">(what people see)</span><input id="authName" maxlength="30"></label>
    <label>Password<input id="authPass" type="password" autocomplete="current-password" required></label>
    <div id="authError" class="error"></div>
    <button class="btn primary block" id="authSubmit">Sign in</button>
  </form>
</div>

<!-- Main app -->
<div id="app" class="app hidden">
  <aside id="sidebar" class="sidebar">
    <button id="newChatBtn" class="btn block new-chat"><b>＋</b> New chat</button>
    <div class="side-section">
      <h4>Chats</h4>
      <ul id="roomList" class="list"></ul>
    </div>
    <div class="side-section">
      <h4>Online now</h4>
      <ul id="onlineList" class="list"></ul>
    </div>
    <div class="side-section">
      <h4>Friends</h4>
      <ul id="friendList" class="list"></ul>
    </div>
  </aside>
  <div id="scrim" class="scrim"></div>

  <main class="main">
    <header class="topbar">
      <button id="menuBtn" class="btn icon mobile-only" title="Chats">☰</button>
      <button id="onlineBtn" class="btn"><span id="onlineCount">0 Online</span> <i class="dot online"></i></button>
      <button id="settingsBtn" class="btn">Settings</button>
      <button id="signOutBtn" class="btn small">Sign out</button>
      <div class="room-title">
        <span id="roomName">Global chat</span>
        <small id="roomMeta" class="muted"></small>
      </div>
      <button id="membersBtn" class="btn">Members</button>
      <button id="requestGameBtn" class="btn primary">Request a game</button>
    </header>

    <div class="content">
      <section class="chat">
        <div id="messages" class="messages"></div>
        <div id="typing" class="typing"></div>
        <form id="composer" class="composer">
          <input id="msgInput" placeholder="Say hello" maxlength="1000" autocomplete="off">
          <button class="btn primary">Send</button>
        </form>
      </section>
      <section id="gameDock" class="game-dock hidden"></section>
    </div>
  </main>
</div>

<div id="banner" class="banner hidden">Reconnecting…</div>
<div id="modal" class="modal hidden"><div id="modalCard" class="modal-card"></div></div>
<div id="toasts" class="toasts"></div>

<script src="/shared/rules.js"></script>
<script src="games.js"></script>
<script src="app.js"></script>
</body>
</html>
