<title>Apex Circuit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: a single full-bleed 3D viewport with glass HUD panels pinned to the edges; menus are centered cards over a live, slowly orbiting track. */
:root{
  --bg:#07090f;            /* pit-lane night */
  --panel:rgba(12,16,28,.78);
  --panel-2:rgba(18,24,40,.9);
  --edge:rgba(160,190,255,.14);
  --fg:#eef3ff;
  --muted:#8c98b8;
  --accent:#ff7a1a;        /* sodium-lamp orange */
  --accent-2:#39d2ff;      /* telemetry cyan */
  --good:#4ade80;
  --warn:#facc15;
  --bad:#f87171;
  --display:'Orbitron','Rajdhani',system-ui,sans-serif;
  --body:'Rajdhani','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.3;-webkit-font-smoothing:antialiased;position:relative;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
canvas{display:block}

/* ---------- Screens ---------- */
.screen{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;
  padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(120% 90% at 50% 110%,rgba(255,122,26,.10),transparent 60%),linear-gradient(180deg,rgba(7,9,15,.35),rgba(7,9,15,.75));
  overflow:auto;z-index:5}
.screen[hidden]{display:none!important}
.card{width:min(960px,100%);background:linear-gradient(160deg,rgba(26,34,56,.55),rgba(10,13,24,.2)) ,var(--panel);border:1px solid var(--edge);border-radius:14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.05);padding:clamp(18px,3vw,34px);display:flex;flex-direction:column;gap:22px;min-width:0;margin:auto}
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:900;font-size:clamp(28px,5vw,48px);letter-spacing:.08em;margin:0;line-height:1;text-wrap:balance}
.brand h1 span{color:var(--accent);text-shadow:0 0 28px rgba(255,122,26,.55)}
.brand h1{text-shadow:0 2px 0 rgba(0,0,0,.4)}
.brand .sub{color:var(--muted);font-weight:600;letter-spacing:.18em;text-transform:uppercase;font-size:12px}
.eyebrow{font-family:var(--display);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent-2);margin:0 0 8px}
h2{font-family:var(--display);font-weight:700;font-size:clamp(18px,2.6vw,24px);letter-spacing:.06em;margin:0;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.menu-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.tile{background:var(--panel-2);border:1px solid var(--edge);border-radius:12px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:132px;
  transition:transform .15s ease,border-color .15s ease,background .15s ease;position:relative;overflow:hidden}
.tile::before{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent-2),transparent);opacity:0;transition:opacity .2s}
.tile:hover::before{opacity:1}
.tile:hover{transform:translateY(-2px);border-color:rgba(57,210,255,.45);background:rgba(24,32,52,.95);box-shadow:0 12px 30px rgba(0,0,0,.35)}
.tile.accent::before{background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.tile .t-title{font-family:var(--display);font-size:15px;letter-spacing:.08em;text-transform:uppercase}
.tile .t-desc{color:var(--muted);font-size:14px;line-height:1.35}
.tile .t-icon{position:absolute;right:14px;top:12px;font-size:22px;opacity:.5}
.tile.accent{border-color:rgba(255,122,26,.5)}
.tile.accent .t-title{color:var(--accent)}
.tile[disabled]{opacity:.5;cursor:not-allowed;transform:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#1a0d02;border:0;border-radius:10px;padding:12px 22px;
  font-family:var(--display);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:13px;min-height:44px;transition:transform .1s ease,filter .15s ease}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none;transform:none}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--edge)}
.btn.ghost:hover{border-color:rgba(57,210,255,.5)}
.btn.cyan{background:var(--accent-2);color:#03202b}
.btn.sm{padding:8px 14px;min-height:36px;font-size:11px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
input[type=text],select{background:rgba(5,8,16,.7);border:1px solid var(--edge);color:var(--fg);border-radius:8px;padding:10px 12px;font:inherit;font-size:16px;min-height:44px;width:100%}
.seg{display:inline-flex;background:rgba(5,8,16,.7);border:1px solid var(--edge);border-radius:10px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{background:transparent;border:0;border-radius:7px;padding:8px 14px;color:var(--muted);font-weight:600;letter-spacing:.06em;min-height:36px}
.seg button[aria-pressed=true]{background:rgba(57,210,255,.16);color:var(--fg);box-shadow:inset 0 0 0 1px rgba(57,210,255,.45)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:34px;height:34px;border-radius:50%;border:2px solid transparent;padding:0;box-shadow:inset 0 -6px 12px rgba(0,0,0,.35)}
.swatch[aria-pressed=true]{border-color:#fff;transform:scale(1.1)}
.divider{height:1px;background:var(--edge)}
.credits{font-family:var(--display);font-size:20px;letter-spacing:.06em;color:var(--warn);font-variant-numeric:tabular-nums}
.credits small{font-size:11px;color:var(--muted);letter-spacing:.18em;margin-left:6px}

/* Garage */
.garage{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px}
@media (max-width:760px){.garage{grid-template-columns:1fr}}
.preview{background:linear-gradient(180deg,rgba(57,210,255,.06),rgba(0,0,0,.25));border:1px solid var(--edge);border-radius:12px;min-height:260px;position:relative;overflow:hidden}
.preview canvas{width:100%!important;height:100%!important;position:absolute;inset:0}
.stat-line{display:grid;grid-template-columns:110px 1fr 56px;gap:10px;align-items:center;font-size:14px}
.stat-line .bar{height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.stat-line .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-2),var(--accent));border-radius:4px;transition:width .3s ease}
.stat-line .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.upgrades{display:flex;flex-direction:column;gap:10px}
.upg{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;background:var(--panel-2);border:1px solid var(--edge);border-radius:10px;padding:10px 12px}
.upg .ico{font-size:22px;text-align:center}
.upg .name{font-family:var(--display);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.upg .desc{color:var(--muted);font-size:13px}
.pips{display:flex;gap:4px;margin-top:6px}
.pips i{width:18px;height:6px;border-radius:3px;background:rgba(255,255,255,.1)}
.pips i.on{background:var(--accent-2);box-shadow:0 0 8px rgba(57,210,255,.6)}
.upg .btn{white-space:nowrap}

/* Online */
.online{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
@media (max-width:760px){.online{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow:auto;min-width:0}
.pl{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--edge);border-radius:10px;padding:10px 12px;font-size:15px}
.pl .dot{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
.pl .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.pl .tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-family:var(--display)}
.pl .tag.ready{color:var(--good)}
.pl .tag.host{color:var(--accent)}
.status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.status b{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--bad)}
.status.on b{background:var(--good);box-shadow:0 0 8px var(--good)}
.code{font-family:var(--display);letter-spacing:.3em;font-size:26px;color:var(--accent-2)}
.notice{background:rgba(255,122,26,.08);border:1px solid rgba(255,122,26,.35);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.4}

/* Results */
table.results{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.results th,table.results td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--edge);font-size:15px}
table.results th{font-family:var(--display);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
table.results tr.me td{color:var(--accent-2);font-weight:700}
.reward{font-family:var(--display);font-size:22px;color:var(--warn)}
.tbl-wrap{overflow-x:auto;min-width:0}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;z-index:3;font-variant-numeric:tabular-nums}
#hud[hidden]{display:none!important}
.hud-tl{position:absolute;left:max(14px,env(safe-area-inset-left,0px));top:14px;display:flex;flex-direction:column;gap:8px}
.hud-tr{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:14px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.hud-br{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:14px}
.hud-bl{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:14px}
.pill{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:8px 12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pos{font-family:var(--display);font-size:38px;font-weight:900;line-height:1;color:var(--fg)}
.pos sup{font-size:14px;color:var(--muted);margin-left:2px}
.lap{font-family:var(--display);font-size:13px;letter-spacing:.14em;color:var(--muted)}
.lap b{color:var(--fg);font-size:18px}
.time{font-family:var(--display);font-size:20px;letter-spacing:.06em}
.time small{display:block;font-size:10px;letter-spacing:.2em;color:var(--muted)}
#speedo{width:190px;height:150px}
#minimap{width:150px;height:150px;border-radius:12px;background:var(--panel);border:1px solid var(--edge);backdrop-filter:blur(10px)}
.standings{display:flex;flex-direction:column;gap:3px;font-size:13px;min-width:150px}
.standings div{display:flex;gap:8px;align-items:center}
.standings .n{font-family:var(--display);width:16px;color:var(--muted);font-size:11px}
.standings .c{width:8px;height:8px;border-radius:50%}
.standings .me{color:var(--accent-2);font-weight:700}
.standings .gap{margin-left:auto;color:var(--muted);font-size:12px}
#msg{position:absolute;left:50%;top:14%;transform:translateX(-50%);font-family:var(--display);font-weight:900;font-size:clamp(34px,9vw,96px);letter-spacing:.1em;
  color:#fff;text-shadow:0 0 30px rgba(255,122,26,.8),0 4px 0 rgba(0,0,0,.5);opacity:0;transition:opacity .2s;white-space:nowrap}
#msg.show{opacity:1}
#msg.green{color:var(--good);text-shadow:0 0 30px rgba(74,222,128,.8)}
#toast{position:absolute;left:50%;top:26%;transform:translateX(-50%);font-family:var(--display);font-size:clamp(14px,2.4vw,20px);letter-spacing:.16em;color:var(--warn);
  text-shadow:0 2px 10px rgba(0,0,0,.8);opacity:0;transition:opacity .3s;white-space:nowrap}
#toast.show{opacity:1}
#toast.good{color:var(--good)}#toast.bad{color:var(--bad)}
.pill.bump{animation:bump .5s ease}
.pill.bump.up{border-color:rgba(74,222,128,.7)}.pill.bump.down{border-color:rgba(248,113,113,.7)}
@keyframes bump{30%{transform:scale(1.1)}}
table.results td.p1{color:#ffd166;font-weight:900}table.results td.p2{color:#d6dcea;font-weight:900}table.results td.p3{color:#d08a4a;font-weight:900}
#wrongway{position:absolute;left:50%;top:40%;transform:translateX(-50%);font-family:var(--display);font-size:22px;letter-spacing:.2em;color:var(--bad);
  text-shadow:0 0 20px rgba(248,113,113,.8);opacity:0;transition:opacity .2s}
#wrongway.show{opacity:1;animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
#nitrobar{width:190px;height:10px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden;border:1px solid var(--edge)}
#nitrobar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#39d2ff,#8be9ff);box-shadow:0 0 12px rgba(57,210,255,.8);transform-origin:left;transition:transform .08s linear}
#nitrobar.boost i{background:linear-gradient(90deg,#ff7a1a,#ffd166)}
.nitro-label{font-family:var(--display);font-size:10px;letter-spacing:.24em;color:var(--muted);margin-top:4px;text-align:right}
#vignette{position:absolute;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%);opacity:.9}
#speedfx{position:absolute;inset:0;pointer-events:none;z-index:2;opacity:0;transition:opacity .2s;background:radial-gradient(ellipse at center,transparent 40%,rgba(57,210,255,.25) 100%)}
#pausebtn{position:absolute;left:50%;transform:translateX(-50%);top:14px;pointer-events:auto}
.icon-btn{background:var(--panel);border:1px solid var(--edge);color:var(--fg);border-radius:10px;min-width:44px;min-height:40px;padding:0 12px;font-family:var(--display);font-size:11px;letter-spacing:.14em;text-transform:uppercase}

/* Touch controls */
#touch{position:absolute;inset:auto 0 0 0;height:36%;display:none;z-index:4;pointer-events:none}
#touch[hidden]{display:none!important}
body.touch #touch{display:block}
.tbtn{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:72px;height:72px;border-radius:50%;background:rgba(12,16,28,.55);border:2px solid rgba(160,190,255,.3);
  color:var(--fg);font-family:var(--display);font-size:11px;letter-spacing:.1em;pointer-events:auto;backdrop-filter:blur(6px);user-select:none;-webkit-user-select:none;touch-action:none}
.tbtn:active,.tbtn.on{background:rgba(57,210,255,.35);border-color:var(--accent-2)}
#t-left{left:max(18px,env(safe-area-inset-left,0px))}
#t-right{left:calc(max(18px,env(safe-area-inset-left,0px)) + 88px)}
#t-gas{right:max(18px,env(safe-area-inset-right,0px));width:84px;height:84px;background:rgba(74,222,128,.25);border-color:rgba(74,222,128,.5)}
#t-brake{right:calc(max(18px,env(safe-area-inset-right,0px)) + 100px);background:rgba(248,113,113,.2);border-color:rgba(248,113,113,.5)}
#t-nitro{right:calc(max(18px,env(safe-area-inset-right,0px)) + 46px);bottom:calc(112px + env(safe-area-inset-bottom,0px));width:64px;height:64px;background:rgba(255,122,26,.25);border-color:rgba(255,122,26,.6)}
body.touch .hud-bl{bottom:calc(36% + 10px)}
body.touch .hud-br{bottom:calc(36% + 10px)}
body.touch #minimap{width:110px;height:110px}
body.touch #speedo{width:150px;height:118px}
body.touch #nitrobar{width:150px}
body.touch .kbd-hint{display:none}
.nitro-label{white-space:nowrap}

.kbd{display:inline-block;border:1px solid var(--edge);border-bottom-width:2px;border-radius:5px;padding:1px 7px;font-family:var(--display);font-size:11px;background:rgba(255,255,255,.05);margin:0 2px}
.controls{display:grid;gap:8px 20px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));font-size:14px;color:var(--muted)}
.controls div{display:flex;justify-content:space-between;gap:8px}
#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);z-index:20;font-family:var(--display);letter-spacing:.2em;font-size:13px;color:var(--muted)}
#loading[hidden]{display:none!important}
.spinner{width:46px;height:46px;border-radius:50%;border:3px solid rgba(255,255,255,.08);border-top-color:var(--accent);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.tile,.btn{transition:none}#wrongway.show{animation:none}}
@media (max-width:520px){.pos{font-size:30px}.standings{display:none}}
</style>
