<!-- ===== LEADERBOARD ===== -->
<div class="screen" id="s-board" hidden>
  <div class="card">
    <div class="brand"><div><p class="eyebrow">Leaderboard</p><h2>Fastest drivers</h2></div><div class="status" id="lb-status"><b></b><span>Loading…</span></div></div>
    <div class="row"><div class="seg" id="lb-track"></div><div class="seg" id="lb-kind"><button type="button" data-v="lap" aria-pressed="true">Best lap</button><button type="button" data-v="drift">Drift score</button></div></div>
    <div class="tbl-wrap"><table class="results"><thead><tr><th>#</th><th>Driver</th><th id="lb-col">Best lap</th></tr></thead><tbody id="lb-body"></tbody></table></div>
    <p class="muted" id="lb-note" style="font-size:14px"></p>
    <div class="row" style="justify-content:space-between"><button class="btn ghost" id="b-board-back" type="button">Back</button><button class="btn ghost sm" id="b-board-refresh" type="button">Refresh</button></div>
  </div>
</div>
