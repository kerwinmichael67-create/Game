<!-- ===== PAUSE ===== -->
<div class="screen" id="s-pause" hidden>
  <div class="card" style="width:min(460px,100%)">
    <div><p class="eyebrow">Paused</p><h2>Race paused</h2></div>
    <p class="muted" id="pause-note" style="font-size:14px">In online races the clock keeps running.</p>
    <div class="row"><button class="btn" id="b-resume" type="button">Resume</button><button class="btn ghost" id="b-reset" type="button">Reset car</button><button class="btn ghost" id="b-restart" type="button">Restart</button><button class="btn ghost" id="b-quit" type="button">Quit to menu</button></div>
  </div>
</div>
