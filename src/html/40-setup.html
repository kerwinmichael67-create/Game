<!-- ===== RACE SETUP ===== -->
<div class="screen" id="s-setup" hidden>
  <div class="card">
    <div><p class="eyebrow" id="setup-eyebrow">Race the AI</p><h2 id="setup-title">Set up your race</h2><p class="muted" id="setup-desc" style="font-size:15px;margin-top:8px"></p></div>
    <div class="grid">
      <div class="field" id="f-track"><label>Circuit</label><div class="seg" id="sel-track"></div><p class="muted" id="track-desc" style="font-size:14px;margin-top:6px"></p></div>
      <div class="field" id="f-laps"><label>Laps</label><div class="seg" id="sel-laps"><button type="button" data-v="1">1</button><button type="button" data-v="3" aria-pressed="true">3</button><button type="button" data-v="5">5</button></div></div>
      <div class="field" id="f-diff"><label>AI difficulty</label><div class="seg" id="sel-diff"><button type="button" data-v="0">Rookie</button><button type="button" data-v="1" aria-pressed="true">Pro</button><button type="button" data-v="2">Legend</button></div></div>
      <div class="field" id="f-bots"><label>Opponents</label><div class="seg" id="sel-bots"><button type="button" data-v="3">3</button><button type="button" data-v="5" aria-pressed="true">5</button><button type="button" data-v="7">7</button></div></div>
    </div>
    <div class="row" style="justify-content:space-between">
      <button class="btn ghost" id="b-setup-back" type="button">Back</button>
      <button class="btn" id="b-setup-go" type="button">Start race</button>
    </div>
  </div>
</div>
