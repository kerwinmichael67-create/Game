<!-- ===== RESULTS ===== -->
<div class="screen" id="s-results" hidden>
  <canvas id="confetti"></canvas>
  <div class="card">
    <div class="brand"><div><p class="eyebrow" id="res-eyebrow">Race complete</p><h2 id="res-title">Results</h2></div><div class="reward" id="res-reward"></div></div>
    <div class="tbl-wrap"><table class="results"><thead><tr id="res-head"></tr></thead><tbody id="res-body"></tbody></table></div>
    <p class="muted" id="res-note" style="font-size:14px"></p>
    <div class="row" style="justify-content:space-between">
      <button class="btn ghost" id="b-res-menu" type="button">Main menu</button>
      <div class="row"><button class="btn ghost" id="b-res-garage" type="button">Garage</button><button class="btn" id="b-res-again" type="button">Race again</button></div>
    </div>
  </div>
</div>
